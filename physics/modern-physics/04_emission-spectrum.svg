<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">發射光譜</title><desc id="d">原子躍遷產生離散譜線而非連續光譜。</desc><rect width="900" height="520" fill="#0b0d10"/><text x="45" y="55" fill="#f5f7fa" font-size="30" font-family="sans-serif" font-weight="700">發射光譜｜LINE SPECTRUM</text><text x="45" y="88" fill="#9aa6b2" font-size="16" font-family="sans-serif">每種原子的允許能階不同，因此譜線位置具有辨識性。</text><rect x="80" y="150" width="740" height="115" rx="12" fill="#050608" stroke="#39424e"/><g stroke-width="9"><line x1="190" y1="165" x2="190" y2="250" stroke="#6a7cff"/><line x1="310" y1="165" x2="310" y2="250" stroke="#6ed4ff"/><line x1="475" y1="165" x2="475" y2="250" stroke="#58e0a7"/><line x1="625" y1="165" x2="625" y2="250" stroke="#ffb25b"/><line x1="730" y1="165" x2="730" y2="250" stroke="#ff765b"/></g><text x="85" y="300" fill="#9aa6b2" font-size="15" font-family="sans-serif">短波長 / 高頻率</text><text x="675" y="300" fill="#9aa6b2" font-size="15" font-family="sans-serif">長波長 / 低頻率</text><path d="M120 390H770" stroke="#39424e" stroke-width="3"/><g fill="#f5f7fa" font-size="17" font-family="sans-serif"><text x="125" y="430">能階差</text><text x="320" y="430">→</text><text x="390" y="430">光子能量 hν</text><text x="600" y="430">→</text><text x="665" y="430">譜線位置</text></g><text x="45" y="485" fill="#9aa6b2" font-size="15" font-family="sans-serif">DIAGRAM · 譜線是離散的，反映原子能階差。</text></svg>