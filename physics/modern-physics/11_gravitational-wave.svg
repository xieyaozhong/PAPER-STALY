<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">重力波 strain 波形</title><desc id="d">雙緻密天體併合前的 chirp 波形，頻率與振幅逐漸增加。</desc><rect width="900" height="520" fill="#0b0d10"/><text x="45" y="55" fill="#f5f7fa" font-size="30" font-family="sans-serif" font-weight="700">重力波｜GRAVITATIONAL-WAVE CHIRP</text><text x="45" y="88" fill="#9aa6b2" font-size="16" font-family="sans-serif">雙緻密天體螺旋接近時，波形的頻率與振幅逐漸增加。</text><line x1="90" y1="300" x2="820" y2="300" stroke="#39424e" stroke-width="2"/><line x1="90" y1="130" x2="90" y2="420" stroke="#39424e" stroke-width="2"/><text x="785" y="335" fill="#9aa6b2" font-size="16" font-family="sans-serif">time</text><text x="35" y="145" fill="#9aa6b2" font-size="16" font-family="sans-serif">strain</text><path d="M95 300 C120 290 145 310 170 300 C195 287 220 313 245 300 C270 283 295 317 320 300 C345 278 370 322 395 300 C420 270 445 330 470 300 C495 260 520 340 545 300 C570 248 595 352 620 300 C645 230 670 370 695 300 C720 205 742 395 765 300 C784 185 800 408 818 300" fill="none" stroke="#6ed4ff" stroke-width="5"/><path d="M95 300 C180 300 250 298 330 295 C440 290 540 260 620 210 C680 170 735 145 805 135" fill="none" stroke="#ffb25b" stroke-width="2" stroke-dasharray="7 7" opacity=".7"/><path d="M95 300 C180 300 250 302 330 305 C440 310 540 340 620 390 C680 430 735 455 805 465" fill="none" stroke="#ffb25b" stroke-width="2" stroke-dasharray="7 7" opacity=".7"/><text x="610" y="120" fill="#ffb25b" font-size="17" font-family="sans-serif">振幅增加</text><text x="620" y="400" fill="#6ed4ff" font-size="17" font-family="sans-serif">頻率增加 → chirp</text><rect x="100" y="420" width="700" height="55" rx="12" fill="#12161c" stroke="#39424e"/><text x="450" y="454" text-anchor="middle" fill="#9aa6b2" font-size="16" font-family="sans-serif">MODEL · 可用 GWOSC 公開 strain data 替換此示意波形，做成真實資料判讀題。</text></svg>