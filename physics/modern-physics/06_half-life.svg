<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">半衰期</title><desc id="d">每經過一個半衰期，未衰變原子核數量減半。</desc><rect width="900" height="520" fill="#0b0d10"/><text x="45" y="55" fill="#f5f7fa" font-size="30" font-family="sans-serif" font-weight="700">半衰期｜HALF-LIFE</text><text x="45" y="88" fill="#9aa6b2" font-size="16" font-family="sans-serif">固定時間間隔後，剩餘未衰變數量以 1/2 比例遞減。</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(135 245)"><circle r="72" fill="#ffb25b" opacity=".9"/><text y="7" fill="#0b0d10" font-size="25" font-weight="700">N₀</text><text y="115" fill="#f5f7fa" font-size="18">t = 0</text></g><g transform="translate(345 245)"><path d="M0-72A72 72 0 1 1 0 72Z" fill="#6ed4ff"/><path d="M0-72A72 72 0 0 0 0 72Z" fill="#39424e"/><text y="7" fill="#f5f7fa" font-size="25" font-weight="700">N₀/2</text><text y="115" fill="#f5f7fa" font-size="18">1 T½</text></g><g transform="translate(555 245)"><circle r="72" fill="#39424e"/><path d="M0-72A72 72 0 0 1 72 0L0 0Z" fill="#6ed4ff"/><text y="7" fill="#f5f7fa" font-size="25" font-weight="700">N₀/4</text><text y="115" fill="#f5f7fa" font-size="18">2 T½</text></g><g transform="translate(765 245)"><circle r="72" fill="#39424e"/><path d="M0-72A72 72 0 0 1 50-52L0 0Z" fill="#6ed4ff"/><text y="7" fill="#f5f7fa" font-size="25" font-weight="700">N₀/8</text><text y="115" fill="#f5f7fa" font-size="18">3 T½</text></g></g><path d="M210 245H270M420 245H480M630 245H690" stroke="#d9e0e7" stroke-width="3" stroke-dasharray="7 7"/><text x="45" y="450" fill="#ffb25b" font-size="20" font-family="sans-serif">記憶：每一個半衰期 × 1/2</text><text x="45" y="485" fill="#9aa6b2" font-size="15" font-family="sans-serif">DIAGRAM · 半衰期是群體統計特徵，不代表每個原子核都在同一時間衰變。</text></svg>