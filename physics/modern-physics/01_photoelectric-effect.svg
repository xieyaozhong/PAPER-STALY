<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">光電效應</title><desc id="d">光子照射金屬表面，頻率足夠時電子逸出。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6ed4ff"/></marker></defs><rect width="900" height="520" fill="#0b0d10"/><text x="45" y="55" fill="#f5f7fa" font-size="30" font-family="sans-serif" font-weight="700">光電效應｜PHOTOELECTRIC EFFECT</text><text x="45" y="88" fill="#9aa6b2" font-size="16" font-family="sans-serif">光子的能量必須先克服金屬逸出功。</text><g stroke="#ffb25b" stroke-width="6" fill="none"><path d="M90 160q30-35 60 0t60 0t60 0"/><path d="M90 220q30-35 60 0t60 0t60 0"/></g><text x="100" y="135" fill="#ffb25b" font-size="18" font-family="sans-serif">入射光子 hν</text><rect x="330" y="135" width="100" height="250" rx="8" fill="#39424e"/><text x="347" y="415" fill="#9aa6b2" font-size="17" font-family="sans-serif">金屬表面</text><circle cx="385" cy="225" r="12" fill="#6ed4ff"/><circle cx="385" cy="295" r="12" fill="#6ed4ff"/><path d="M430 225 C520 185 595 155 675 130" stroke="#6ed4ff" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M430 295 C520 330 595 350 670 365" stroke="#6ed4ff" stroke-width="4" fill="none" marker-end="url(#a)"/><text x="590" y="110" fill="#6ed4ff" font-size="18" font-family="sans-serif">逸出電子</text><rect x="545" y="215" width="285" height="105" rx="14" fill="#12161c" stroke="#39424e"/><text x="570" y="250" fill="#f5f7fa" font-size="22" font-family="sans-serif">Kmax = hν − φ</text><text x="570" y="282" fill="#9aa6b2" font-size="16" font-family="sans-serif">若 hν &lt; φ，沒有電子逸出</text><text x="45" y="475" fill="#9aa6b2" font-size="15" font-family="sans-serif">DIAGRAM · 頻率決定單一光子能量；光強主要影響可用光子數量。</text></svg>