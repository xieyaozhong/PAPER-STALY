<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">核融合</title><desc id="d">輕原子核在高溫高壓下結合成較重原子核並釋放能量。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d9e0e7"/></marker></defs><rect width="900" height="520" fill="#0b0d10"/><text x="45" y="55" fill="#f5f7fa" font-size="30" font-family="sans-serif" font-weight="700">核融合｜NUCLEAR FUSION</text><text x="45" y="88" fill="#9aa6b2" font-size="16" font-family="sans-serif">輕原子核結合成較重原子核，質量差轉換為能量。</text><g transform="translate(190 250)"><circle cx="-45" cy="0" r="42" fill="#6ed4ff"/><circle cx="45" cy="0" r="42" fill="#ffb25b"/><text x="-45" y="7" text-anchor="middle" fill="#0b0d10" font-size="22" font-family="sans-serif" font-weight="700">D</text><text x="45" y="7" text-anchor="middle" fill="#0b0d10" font-size="22" font-family="sans-serif" font-weight="700">T</text></g><path d="M285 250H430" stroke="#d9e0e7" stroke-width="4" marker-end="url(#a)"/><g transform="translate(535 250)"><circle cx="-28" cy="-25" r="38" fill="#ffb25b"/><circle cx="28" cy="-25" r="38" fill="#6ed4ff"/><circle cx="-28" cy="28" r="38" fill="#6ed4ff"/><circle cx="28" cy="28" r="38" fill="#ffb25b"/></g><circle cx="660" cy="250" r="12" fill="#6ed4ff"/><path d="M610 250H640" stroke="#d9e0e7" stroke-width="3" marker-end="url(#a)"/><g stroke="#ffb25b" stroke-width="6"><path d="M730 205l35-35M750 250h55M730 295l35 35"/></g><text x="500" y="365" fill="#f5f7fa" font-size="18" font-family="sans-serif">較重原子核</text><text x="642" y="285" fill="#6ed4ff" font-size="17" font-family="sans-serif">n</text><text x="730" y="365" fill="#ffb25b" font-size="18" font-family="sans-serif">能量</text><rect x="105" y="410" width="690" height="60" rx="12" fill="#12161c" stroke="#39424e"/><text x="450" y="445" text-anchor="middle" fill="#9aa6b2" font-size="16" font-family="sans-serif">DIAGRAM · 核融合需要高溫克服核間電斥力；恆星的能量主要來自融合反應。</text></svg>