<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">核分裂</title><desc id="d">重原子核吸收中子後分裂成較小原子核並釋放中子與能量。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d9e0e7"/></marker></defs><rect width="900" height="520" fill="#0b0d10"/><text x="45" y="55" fill="#f5f7fa" font-size="30" font-family="sans-serif" font-weight="700">核分裂｜NUCLEAR FISSION</text><text x="45" y="88" fill="#9aa6b2" font-size="16" font-family="sans-serif">重原子核分裂時可釋放中子與大量能量。</text><circle cx="100" cy="250" r="13" fill="#6ed4ff"/><text x="75" y="210" fill="#6ed4ff" font-size="17" font-family="sans-serif">n</text><path d="M120 250H220" stroke="#6ed4ff" stroke-width="4" marker-end="url(#a)"/><g transform="translate(320 250)"><circle cx="-28" cy="-18" r="38" fill="#ffb25b"/><circle cx="25" cy="-28" r="36" fill="#6ed4ff"/><circle cx="25" cy="28" r="36" fill="#ffb25b"/><circle cx="-32" cy="32" r="35" fill="#6ed4ff"/></g><text x="290" y="355" fill="#f5f7fa" font-size="18" font-family="sans-serif">重原子核</text><path d="M410 250H520" stroke="#d9e0e7" stroke-width="4" marker-end="url(#a)"/><g transform="translate(640 220)"><circle cx="-40" cy="0" r="48" fill="#ffb25b"/><circle cx="55" cy="35" r="43" fill="#6ed4ff"/></g><g fill="#6ed4ff"><circle cx="610" cy="340" r="10"/><circle cx="675" cy="355" r="10"/><circle cx="735" cy="325" r="10"/></g><g stroke="#ffb25b" stroke-width="5"><path d="M765 170l25-25M780 205l40-5M755 235l28 22"/></g><text x="570" y="410" fill="#f5f7fa" font-size="18" font-family="sans-serif">較小原子核 + 中子 + 能量</text><rect x="95" y="425" width="705" height="55" rx="12" fill="#12161c" stroke="#39424e"/><text x="450" y="458" text-anchor="middle" fill="#9aa6b2" font-size="16" font-family="sans-serif">DIAGRAM · 釋出的中子可再引發其他核分裂，形成鏈式反應。</text></svg>