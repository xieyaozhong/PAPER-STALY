<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">原子能階與躍遷</title><desc id="d">電子只能存在於離散能階，躍遷時吸收或放出光子。</desc><defs><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffb25b"/></marker><marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6ed4ff"/></marker></defs><rect width="900" height="520" fill="#0b0d10"/><text x="45" y="55" fill="#f5f7fa" font-size="30" font-family="sans-serif" font-weight="700">原子能階與躍遷｜ENERGY LEVELS</text><text x="45" y="88" fill="#9aa6b2" font-size="16" font-family="sans-serif">原子中的電子只能具有特定能量。</text><g stroke="#d9e0e7" stroke-width="3"><line x1="150" y1="390" x2="520" y2="390"/><line x1="150" y1="315" x2="520" y2="315"/><line x1="150" y1="225" x2="520" y2="225"/><line x1="150" y1="125" x2="520" y2="125"/></g><g fill="#9aa6b2" font-size="18" font-family="sans-serif"><text x="90" y="397">E₁</text><text x="90" y="322">E₂</text><text x="90" y="232">E₃</text><text x="90" y="132">E₄</text></g><path d="M260 315V145" stroke="#ffb25b" stroke-width="5" marker-end="url(#o)"/><text x="275" y="210" fill="#ffb25b" font-size="18" font-family="sans-serif">吸收光子</text><path d="M420 125V295" stroke="#6ed4ff" stroke-width="5" marker-end="url(#c)"/><path d="M455 195q20-20 40 0t40 0t40 0" fill="none" stroke="#6ed4ff" stroke-width="4"/><text x="570" y="200" fill="#6ed4ff" font-size="18" font-family="sans-serif">放出光子</text><rect x="570" y="265" width="265" height="105" rx="14" fill="#12161c" stroke="#39424e"/><text x="595" y="306" fill="#f5f7fa" font-size="24" font-family="sans-serif">ΔE = hν</text><text x="595" y="340" fill="#9aa6b2" font-size="16" font-family="sans-serif">能階差決定光子頻率</text><text x="45" y="475" fill="#9aa6b2" font-size="15" font-family="sans-serif">DIAGRAM · 能量不是連續任意值，而是量子化的離散能階。</text></svg>