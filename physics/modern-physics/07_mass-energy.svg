<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">質能互換</title><desc id="d">少量質量差可對應巨大能量，公式 E=mc^2。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d9e0e7"/></marker></defs><rect width="900" height="520" fill="#0b0d10"/><text x="45" y="55" fill="#f5f7fa" font-size="30" font-family="sans-serif" font-weight="700">質能互換｜MASS–ENERGY</text><text x="45" y="88" fill="#9aa6b2" font-size="16" font-family="sans-serif">質量可以視為一種能量儲存形式。</text><circle cx="215" cy="250" r="95" fill="#39424e" stroke="#6ed4ff" stroke-width="4"/><text x="215" y="240" text-anchor="middle" fill="#f5f7fa" font-size="26" font-family="sans-serif" font-weight="700">mass</text><text x="215" y="275" text-anchor="middle" fill="#6ed4ff" font-size="28" font-family="sans-serif">m</text><path d="M330 250H530" stroke="#d9e0e7" stroke-width="5" marker-end="url(#a)"/><text x="365" y="220" fill="#ffb25b" font-size="28" font-family="sans-serif" font-weight="700">E = mc²</text><g transform="translate(665 250)"><circle r="42" fill="#ffb25b"/><path d="M0-95V-55M0 55V95M-95 0H-55M55 0H95M-68-68L-40-40M68 68L40 40M68-68L40-40M-68 68L-40 40" stroke="#ffb25b" stroke-width="8"/></g><text x="665" y="380" text-anchor="middle" fill="#f5f7fa" font-size="22" font-family="sans-serif">energy</text><rect x="120" y="410" width="660" height="55" rx="12" fill="#12161c" stroke="#39424e"/><text x="450" y="445" text-anchor="middle" fill="#9aa6b2" font-size="17" font-family="sans-serif">核反應中：反應前後的質量差 Δm → 釋放或吸收能量 ΔE = Δmc²</text></svg>