<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">德布羅意物質波</title><desc id="d">移動粒子以波長 lambda=h/p 表示其物質波性。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6ed4ff"/></marker></defs><rect width="900" height="520" fill="#0b0d10"/><text x="45" y="55" fill="#f5f7fa" font-size="30" font-family="sans-serif" font-weight="700">德布羅意物質波｜MATTER WAVE</text><text x="45" y="88" fill="#9aa6b2" font-size="16" font-family="sans-serif">粒子具有動量，也能以波長描述其波動性。</text><circle cx="175" cy="255" r="34" fill="#ffb25b"/><text x="158" y="263" fill="#0b0d10" font-size="19" font-family="sans-serif" font-weight="700">e⁻</text><path d="M215 255H360" stroke="#6ed4ff" stroke-width="5" marker-end="url(#a)"/><text x="250" y="235" fill="#6ed4ff" font-size="17" font-family="sans-serif">momentum p</text><path d="M390 255 C420 190 450 320 480 255 S540 190 570 255 S630 320 660 255 S720 190 750 255" fill="none" stroke="#6ed4ff" stroke-width="5"/><line x1="420" y1="345" x2="540" y2="345" stroke="#d9e0e7" stroke-width="2"/><line x1="420" y1="335" x2="420" y2="355" stroke="#d9e0e7" stroke-width="2"/><line x1="540" y1="335" x2="540" y2="355" stroke="#d9e0e7" stroke-width="2"/><text x="468" y="375" fill="#f5f7fa" font-size="20" font-family="sans-serif">λ</text><rect x="545" y="110" width="270" height="100" rx="14" fill="#12161c" stroke="#39424e"/><text x="575" y="152" fill="#f5f7fa" font-size="26" font-family="sans-serif">λ = h / p</text><text x="575" y="185" fill="#9aa6b2" font-size="16" font-family="sans-serif">動量越大 → 波長越短</text><text x="45" y="475" fill="#9aa6b2" font-size="15" font-family="sans-serif">DIAGRAM · 電子、中子、原子等微觀粒子皆可展現物質波特性。</text></svg>