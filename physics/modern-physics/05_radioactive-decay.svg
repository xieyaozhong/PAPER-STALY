<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">放射性衰變</title><desc id="d">未衰變原子核數量隨時間呈指數下降。</desc><rect width="900" height="520" fill="#0b0d10"/><text x="45" y="55" fill="#f5f7fa" font-size="30" font-family="sans-serif" font-weight="700">放射性衰變｜RADIOACTIVE DECAY</text><text x="45" y="88" fill="#9aa6b2" font-size="16" font-family="sans-serif">單一原子核的衰變時刻不可預測，但大量核的統計行為可描述。</text><line x1="120" y1="410" x2="770" y2="410" stroke="#d9e0e7" stroke-width="2"/><line x1="120" y1="410" x2="120" y2="125" stroke="#d9e0e7" stroke-width="2"/><text x="735" y="445" fill="#9aa6b2" font-size="16" font-family="sans-serif">time</text><text x="65" y="130" fill="#9aa6b2" font-size="16" font-family="sans-serif">N</text><path d="M120 145 C250 190 320 250 400 305 C500 365 620 392 760 405" fill="none" stroke="#6ed4ff" stroke-width="6"/><line x1="120" y1="275" x2="360" y2="275" stroke="#39424e" stroke-width="2" stroke-dasharray="8 8"/><line x1="360" y1="275" x2="360" y2="410" stroke="#39424e" stroke-width="2" stroke-dasharray="8 8"/><text x="135" y="165" fill="#ffb25b" font-size="17" font-family="sans-serif">N₀</text><text x="135" y="270" fill="#6ed4ff" font-size="17" font-family="sans-serif">N₀/2</text><text x="345" y="445" fill="#6ed4ff" font-size="17" font-family="sans-serif">T½</text><rect x="535" y="125" width="275" height="95" rx="14" fill="#12161c" stroke="#39424e"/><text x="565" y="165" fill="#f5f7fa" font-size="23" font-family="sans-serif">N = N₀ e^(−λt)</text><text x="565" y="198" fill="#9aa6b2" font-size="15" font-family="sans-serif">λ：衰變常數</text><text x="45" y="485" fill="#9aa6b2" font-size="15" font-family="sans-serif">MODEL · 指數曲線描述大量相同放射性原子核的平均統計行為。</text></svg>