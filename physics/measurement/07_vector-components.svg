<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><defs><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffb25b"/></marker><marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6ed4ff"/></marker></defs><rect width="900" height="520" fill="#0b0d10"/><text x="45" y="55" fill="#f5f7fa" font-size="30" font-family="sans-serif" font-weight="700">向量分解｜VECTOR COMPONENTS</text><text x="45" y="88" fill="#9aa6b2" font-size="16" font-family="sans-serif">將一個向量分解成互相垂直的 x、y 分量。</text><line x1="150" y1="390" x2="760" y2="390" stroke="#39424e"/><line x1="150" y1="390" x2="150" y2="120" stroke="#39424e"/><path d="M150 390L590 165" stroke="#ffb25b" stroke-width="6" marker-end="url(#o)"/><path d="M150 390H590" stroke="#6ed4ff" stroke-width="5" marker-end="url(#c)"/><path d="M590 390V165" stroke="#6ed4ff" stroke-width="5" marker-end="url(#c)"/><path d="M245 390 A95 95 0 0 0 230 348" fill="none" stroke="#d9e0e7" stroke-width="2"/><text x="250" y="365" fill="#f5f7fa" font-size="18" font-family="sans-serif">θ</text><text x="355" y="370" fill="#6ed4ff" font-size="19" font-family="sans-serif">Aₓ = A cosθ</text><text x="605" y="285" fill="#6ed4ff" font-size="19" font-family="sans-serif">Aᵧ = A sinθ</text><text x="430" y="215" fill="#ffb25b" font-size="20" font-family="sans-serif">A</text><rect x="135" y="425" width="630" height="55" rx="12" fill="#12161c" stroke="#39424e"/><text x="450" y="458" text-anchor="middle" fill="#9aa6b2" font-size="16" font-family="sans-serif">DIAGRAM · 分量不是額外的力，而是同一向量在指定座標軸上的表示。</text></svg>