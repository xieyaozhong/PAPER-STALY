<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><rect width="900" height="520" fill="#0b0d10"/><text x="45" y="55" fill="#f5f7fa" font-size="30" font-family="sans-serif" font-weight="700">線性擬合｜LINEAR FIT</text><text x="45" y="88" fill="#9aa6b2" font-size="16" font-family="sans-serif">用最佳直線描述資料趨勢，斜率與截距常對應物理參數。</text><line x1="110" y1="405" x2="790" y2="405" stroke="#39424e" stroke-width="2"/><line x1="110" y1="405" x2="110" y2="125" stroke="#39424e" stroke-width="2"/><g fill="#6ed4ff"><circle cx="170" cy="355" r="8"/><circle cx="245" cy="330" r="8"/><circle cx="320" cy="290" r="8"/><circle cx="395" cy="260" r="8"/><circle cx="470" cy="230" r="8"/><circle cx="545" cy="205" r="8"/><circle cx="620" cy="165" r="8"/><circle cx="695" cy="145" r="8"/></g><line x1="145" y1="365" x2="725" y2="135" stroke="#ffb25b" stroke-width="5"/><path d="M535 245V330H675" fill="none" stroke="#d9e0e7" stroke-width="2" stroke-dasharray="6 6"/><text x="596" y="350" fill="#f5f7fa" font-size="17" font-family="sans-serif">Δx</text><text x="505" y="290" fill="#f5f7fa" font-size="17" font-family="sans-serif">Δy</text><rect x="565" y="300" width="240" height="75" rx="12" fill="#12161c" stroke="#39424e"/><text x="685" y="330" text-anchor="middle" fill="#f5f7fa" font-size="22" font-family="sans-serif">y = mx + b</text><text x="685" y="357" text-anchor="middle" fill="#9aa6b2" font-size="15" font-family="sans-serif">m = Δy / Δx</text><text x="45" y="475" fill="#9aa6b2" font-size="15" font-family="sans-serif">DIAGRAM · 不要用兩個任意資料點算斜率；應使用擬合直線的整體趨勢。</text></svg>