<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><rect width="900" height="520" fill="#0b0d10"/><text x="45" y="55" fill="#f5f7fa" font-size="30" font-family="sans-serif" font-weight="700">SI 基本量與單位｜BASE UNITS</text><text x="45" y="88" fill="#9aa6b2" font-size="16" font-family="sans-serif">物理量先確認「量」與「單位」，再進行公式與換算。</text><g font-family="sans-serif" text-anchor="middle"><g fill="#12161c" stroke="#39424e"><rect x="55" y="135" width="150" height="105" rx="14"/><rect x="225" y="135" width="150" height="105" rx="14"/><rect x="395" y="135" width="150" height="105" rx="14"/><rect x="565" y="135" width="150" height="105" rx="14"/><rect x="140" y="280" width="150" height="105" rx="14"/><rect x="310" y="280" width="150" height="105" rx="14"/><rect x="480" y="280" width="150" height="105" rx="14"/></g><g fill="#6ed4ff" font-size="20" font-weight="700"><text x="130" y="175">長度</text><text x="300" y="175">質量</text><text x="470" y="175">時間</text><text x="640" y="175">電流</text><text x="215" y="320">溫度</text><text x="385" y="320">物質量</text><text x="555" y="320">發光強度</text></g><g fill="#f5f7fa" font-size="25"><text x="130" y="215">m</text><text x="300" y="215">kg</text><text x="470" y="215">s</text><text x="640" y="215">A</text><text x="215" y="360">K</text><text x="385" y="360">mol</text><text x="555" y="360">cd</text></g></g><text x="45" y="455" fill="#ffb25b" font-size="19" font-family="sans-serif">衍生單位例：N = kg·m·s⁻²</text><text x="45" y="485" fill="#9aa6b2" font-size="15" font-family="sans-serif">DIAGRAM · 單位也是物理關係的一部分。</text></svg>