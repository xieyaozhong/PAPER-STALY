<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d9e0e7"/></marker></defs><rect width="900" height="520" fill="#0b0d10"/><text x="45" y="55" fill="#f5f7fa" font-size="30" font-family="sans-serif" font-weight="700">實驗資料流程｜EXPERIMENT WORKFLOW</text><text x="45" y="88" fill="#9aa6b2" font-size="16" font-family="sans-serif">從量測到結論，中間必須包含校正、資料處理與模型檢驗。</text><g font-family="sans-serif" text-anchor="middle"><g fill="#12161c" stroke="#39424e"><rect x="55" y="180" width="130" height="105" rx="14"/><rect x="220" y="180" width="130" height="105" rx="14"/><rect x="385" y="180" width="130" height="105" rx="14"/><rect x="550" y="180" width="130" height="105" rx="14"/><rect x="715" y="180" width="130" height="105" rx="14"/></g><g font-size="20" font-weight="700"><text x="120" y="220" fill="#6ed4ff">量測</text><text x="285" y="220" fill="#6ed4ff">校正</text><text x="450" y="220" fill="#6ed4ff">整理</text><text x="615" y="220" fill="#ffb25b">模型</text><text x="780" y="220" fill="#ffb25b">檢驗</text></g><g fill="#9aa6b2" font-size="14"><text x="120" y="252">感測器／尺規</text><text x="285" y="252">零點／標準值</text><text x="450" y="252">圖表／平均值</text><text x="615" y="252">理論關係</text><text x="780" y="252">殘差／不確定度</text></g></g><g stroke="#d9e0e7" stroke-width="3" marker-end="url(#a)"><line x1="185" y1="233" x2="215" y2="233"/><line x1="350" y1="233" x2="380" y2="233"/><line x1="515" y1="233" x2="545" y2="233"/><line x1="680" y1="233" x2="710" y2="233"/></g><path d="M780 305 C780 390 615 405 615 305" fill="none" stroke="#6ed4ff" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#a)"/><text x="700" y="395" fill="#6ed4ff" font-size="16" font-family="sans-serif">不符合 → 修正模型／實驗</text><rect x="120" y="420" width="660" height="55" rx="12" fill="#12161c" stroke="#39424e"/><text x="450" y="454" text-anchor="middle" fill="#9aa6b2" font-size="16" font-family="sans-serif">DIAGRAM 