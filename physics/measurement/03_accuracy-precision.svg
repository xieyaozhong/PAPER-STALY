<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><rect width="900" height="520" fill="#0b0d10"/><text x="45" y="55" fill="#f5f7fa" font-size="30" font-family="sans-serif" font-weight="700">準確度 vs 精密度｜ACCURACY &amp; PRECISION</text><text x="45" y="88" fill="#9aa6b2" font-size="16" font-family="sans-serif">準確度看「接近真值」，精密度看「彼此集中」。</text><g transform="translate(255 270)"><circle r="120" fill="none" stroke="#39424e" stroke-width="3"/><circle r="75" fill="none" stroke="#39424e"/><circle r="30" fill="none" stroke="#ffb25b" stroke-width="3"/><circle r="6" fill="#ffb25b"/><g fill="#6ed4ff"><circle cx="-18" cy="12" r="7"/><circle cx="12" cy="-10" r="7"/><circle cx="18" cy="17" r="7"/><circle cx="-8" cy="-20" r="7"/></g></g><text x="255" y="430" text-anchor="middle" fill="#f5f7fa" font-size="19" font-family="sans-serif">高準確度 + 高精密度</text><g transform="translate(650 270)"><circle r="120" fill="none" stroke="#39424e" stroke-width="3"/><circle r="75" fill="none" stroke="#39424e"/><circle r="30" fill="none" stroke="#ffb25b" stroke-width="3"/><circle r="6" fill="#ffb25b"/><g fill="#6ed4ff"><circle cx="65" cy="-45" r="7"/><circle cx="78" cy="-38" r="7"/><circle cx="70" cy="-28" r="7"/><circle cx="82" cy="-20" r="7"/></g></g><text x="650" y="430" text-anchor="middle" fill="#f5f7fa" font-size="19" font-family="sans-serif">低準確度 + 高精密度</text><text x="45" y="485" fill="#9aa6b2" font-size="15" font-family="sans-serif">DIAGRAM · 系統誤差可能讓結果很集中，卻整體偏離真值。</text></svg>