<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><rect width="900" height="520" fill="#0b0d10"/><text x="45" y="55" fill="#f5f7fa" font-size="30" font-family="sans-serif" font-weight="700">重複量測與誤差棒｜REPEATED MEASUREMENTS</text><text x="45" y="88" fill="#9aa6b2" font-size="16" font-family="sans-serif">多次量測可估計平均值與資料分散程度。</text><line x1="105" y1="390" x2="785" y2="390" stroke="#39424e"/><line x1="105" y1="130" x2="105" y2="390" stroke="#39424e"/><g fill="#6ed4ff"><circle cx="170" cy="285" r="8"/><circle cx="250" cy="255" r="8"/><circle cx="330" cy="270" r="8"/><circle cx="410" cy="230" r="8"/><circle cx="490" cy="245" r="8"/><circle cx="570" cy="220" r="8"/><circle cx="650" cy="235" r="8"/></g><line x1="410" y1="170" x2="410" y2="315" stroke="#ffb25b" stroke-width="4"/><line x1="360" y1="170" x2="460" y2="170" stroke="#ffb25b" stroke-width="4"/><line x1="360" y1="315" x2="460" y2="315" stroke="#ffb25b" stroke-width="4"/><circle cx="410" cy="242" r="11" fill="#ffb25b"/><text x="435" y="230" fill="#ffb25b" font-size="18" font-family="sans-serif">平均值 ± 分散範圍</text><rect x="520" y="120" width="260" height="95" rx="14" fill="#12161c" stroke="#39424e"/><text x="550" y="158" fill="#f5f7fa" font-size="20" font-family="sans-serif">平均值 x̄</text><text x="550" y="190" fill="#9aa6b2" font-size="16" font-family="sans-serif">誤差棒表示不確定程度</text><text x="45" y="470" fill="#9aa6b2" font-size="15" font-family="sans-serif">DIAGRAM · 誤差棒的定義可能是標準差、標準誤或量測不確定度，使用時必須註明。</text></svg>