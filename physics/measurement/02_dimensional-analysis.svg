<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d9e0e7"/></marker></defs><rect width="900" height="520" fill="#0b0d10"/><text x="45" y="55" fill="#f5f7fa" font-size="30" font-family="sans-serif" font-weight="700">量綱分析｜DIMENSIONAL ANALYSIS</text><text x="45" y="88" fill="#9aa6b2" font-size="16" font-family="sans-serif">公式左右兩邊的量綱必須一致，單位也能用來檢查推導。</text><rect x="70" y="145" width="250" height="120" rx="14" fill="#12161c" stroke="#39424e"/><text x="195" y="190" text-anchor="middle" fill="#f5f7fa" font-size="26" font-family="sans-serif">v = d / t</text><text x="195" y="230" text-anchor="middle" fill="#6ed4ff" font-size="20" font-family="sans-serif">[v] = L T⁻¹</text><path d="M340 205H470" stroke="#d9e0e7" stroke-width="4" marker-end="url(#a)"/><rect x="500" y="145" width="320" height="120" rx="14" fill="#12161c" stroke="#39424e"/><text x="660" y="190" text-anchor="middle" fill="#f5f7fa" font-size="23" font-family="sans-serif">[d]/[t] = L/T</text><text x="660" y="230" text-anchor="middle" fill="#6ed4ff" font-size="20" font-family="sans-serif">= L T⁻¹ ✓</text><rect x="110" y="325" width="680" height="85" rx="14" fill="#12161c" stroke="#39424e"/><text x="450" y="360" text-anchor="middle" fill="#ffb25b" font-size="20" font-family="sans-serif">錯誤示例：d = v + t</text><text x="450" y="392" text-anchor="middle" fill="#9aa6b2" font-size="16" font-family="sans-serif">L ≠ LT⁻¹ + T → 量綱不一致，公式不可能正確</text><text x="45" y="475" fill="#9aa6b2" font-size="15" font-family="sans-serif">DIAGRAM · 量綱分析不能證明公式一定正確，但能快速排除明顯錯誤。</text></svg>