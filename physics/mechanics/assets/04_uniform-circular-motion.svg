<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">等速圓周運動</title><desc id="d">物體沿圓周運動，速度切向，向心力與向心加速度指向圓心。</desc><defs><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ff9f1c"/></marker><marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#56d7e8"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="70" fill="#f6f8fb" font-size="36" font-family="sans-serif" font-weight="700">等速圓周運動｜速度切向，力指向圓心</text><text x="70" y="108" fill="#8d98a6" font-size="18" font-family="monospace">MECHANICS · CENTRIPETAL FORCE</text><circle cx="455" cy="360" r="205" fill="none" stroke="#39424e" stroke-width="4"/><circle cx="455" cy="360" r="8" fill="#f6f8fb"/><circle cx="625" cy="245" r="24" fill="#dfe6ee"/><line x1="625" y1="245" x2="470" y2="350" stroke="#ff9f1c" stroke-width="7" marker-end="url(#o)"/><text x="545" y="275" fill="#ff9f1c" font-size="22" font-family="sans-serif">F_c , a_c</text><line x1="625" y1="245" x2="760" y2="440" stroke="#56d7e8" stroke-width="7" marker-end="url(#c)"/><text x="745" y="405" fill="#56d7e8" font-size="22" font-family="sans-serif">v</text><line x1="455" y1="360" x2="625" y2="245" stroke="#66717f" stroke-width="3" stroke-dasharray="10 8"/><text x="555" y="330" fill="#8d98a6" font-size="19" font-family="sans-serif">r</text><rect x="790" y="180" width="330" height="285" rx="18" fill="#12161c" stroke="#39424e"/><text x="825" y="230" fill="#56d7e8" font-size="23" font-family="sans-serif" font-weight="700">核心關係</text><text x="825" y="285" fill="#f6f8fb" font-size="23" font-family="sans-serif">F_c = mv² / r</text><text x="825" y="335" fill="#f6f8fb" font-size="20" font-family="sans-serif">速度變「方向」</text><text x="825" y="375" fill="#f6f8fb" font-size="20" font-family="sans-serif">所以仍有加速度</text><text x="825" y="425" fill="#8d98a6" font-size="17" font-family="sans-serif">向心力不是新種類的力，而是指向圓心的淨力角色。</text></svg>