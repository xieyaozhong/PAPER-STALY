<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">斜面受力分解</title><desc id="d">方塊位於無摩擦斜面上，顯示重力、正向力及重力平行與垂直斜面的分量。</desc><defs><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ff9f1c"/></marker><marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#56d7e8"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="70" fill="#f6f8fb" font-size="36" font-family="sans-serif" font-weight="700">斜面受力｜重力分解</text><text x="70" y="108" fill="#8d98a6" font-size="18" font-family="monospace">MECHANICS · INCLINED PLANE</text><polygon points="160,520 760,520 760,230" fill="#161b22" stroke="#66717f" stroke-width="4"/><path d="M215 520 A70 70 0 0 1 278 489" fill="none" stroke="#8d98a6" stroke-width="3"/><text x="260" y="500" fill="#f6f8fb" font-size="22" font-family="sans-serif">θ</text><g transform="translate(510 385) rotate(-25)"><rect x="-85" y="-55" width="170" height="110" rx="14" fill="#1d2630" stroke="#dfe6ee" stroke-width="3"/></g><line x1="510" y1="385" x2="510" y2="555" stroke="#ff9f1c" stroke-width="7" marker-end="url(#o)"/><text x="530" y="550" fill="#ff9f1c" font-size="22" font-family="sans-serif">mg</text><line x1="510" y1="385" x2="590" y2="215" stroke="#56d7e8" stroke-width="7" marker-end="url(#c)"/><text x="605" y="220" fill="#56d7e8" font-size="22" font-family="sans-serif">N</text><line x1="510" y1="385" x2="390" y2="440" stroke="#ff9f1c" stroke-width="6" marker-end="url(#o)"/><text x="310" y="455" fill="#ff9f1c" font-size="21" font-family="sans-serif">mg sinθ</text><line x1="510" y1="385" x2="455" y2="265" stroke="#ff9f1c" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#o)"/><text x="315" y="265" fill="#ff9f1c" font-size="21" font-family="sans-serif">mg cosθ</text><rect x="810" y="195" width="310" height="270" rx="18" fill="#12161c" stroke="#39424e"/><text x="845" y="240" fill="#56d7e8" font-size="24" font-family="sans-serif" font-weight="700">無摩擦斜面</text><text x="845" y="295" fill="#f6f8fb" font-size="21" font-family="sans-serif">沿斜面：mg sinθ</text><text x="845" y="340" fill="#f6f8fb" font-size="21" font-family="sans-serif">垂直斜面：mg cosθ</text><text x="845" y="395" fill="#f6f8fb" font-size="21" font-family="sans-serif">a = g sinθ</text><text x="845" y="435" fill="#8d98a6" font-size="17" font-family="sans-serif">質量約去，因此加速度與 m 無關。</text></svg>