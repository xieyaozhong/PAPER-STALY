<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">力矩與槓桿</title><desc id="d">槓桿繞支點轉動，顯示力、力臂與力矩的關係。</desc><defs><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ff9f1c"/></marker><marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#56d7e8"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="70" fill="#f6f8fb" font-size="36" font-family="sans-serif" font-weight="700">力矩與槓桿｜τ = rF sinθ</text><text x="70" y="108" fill="#8d98a6" font-size="18" font-family="monospace">MECHANICS · TORQUE / LEVER ARM</text><rect x="180" y="345" width="760" height="40" rx="12" fill="#dfe6ee"/><polygon points="535,385 600,500 665,385" fill="#ff9f1c"/><circle cx="600" cy="382" r="14" fill="#0b0d10"/><line x1="250" y1="345" x2="250" y2="205" stroke="#56d7e8" stroke-width="7" marker-end="url(#c)"/><text x="210" y="205" fill="#56d7e8" font-size="22" font-family="sans-serif">F₁</text><line x1="870" y1="345" x2="870" y2="500" stroke="#ff9f1c" stroke-width="7" marker-end="url(#o)"/><text x="895" y="495" fill="#ff9f1c" font-size="22" font-family="sans-serif">F₂</text><line x1="250" y1="430" x2="600" y2="430" stroke="#66717f" stroke-width="3"/><line x1="600" y1="430" x2="870" y2="430" stroke="#66717f" stroke-width="3"/><text x="425" y="458" fill="#8d98a6" font-size="20" text-anchor="middle" font-family="sans-serif">r₁</text><text x="735" y="458" fill="#8d98a6" font-size="20" text-anchor="middle" font-family="sans-serif">r₂</text><rect x="760" y="145" width="350" height="150" rx="18" fill="#12161c" stroke="#39424e"/><text x="935" y="195" fill="#f6f8fb" font-size="24" text-anchor="middle" font-family="sans-serif">平衡條件</text><text x="935" y="245" fill="#56d7e8" font-size="26" text-anchor="middle" font-family="sans-serif">τ₁ = τ₂</text><text x="70" y="610" fill="#8d98a6" font-size="18" font-fa