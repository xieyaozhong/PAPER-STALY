<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">胡克定律</title><desc id="d">顯示彈簧位移與回復力方向，以及F等於負kx的線性關係。</desc><defs><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ff9f1c"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="70" fill="#f6f8fb" font-size="36" font-family="sans-serif" font-weight="700">胡克定律｜F = −kx</text><text x="70" y="108" fill="#8d98a6" font-size="18" font-family="monospace">MECHANICS · SPRING / RESTORING FORCE</text><line x1="130" y1="200" x2="130" y2="520" stroke="#dfe6ee" stroke-width="8"/><path d="M130 330 L180 300 L230 360 L280 300 L330 360 L380 300 L430 360 L480 330" fill="none" stroke="#56d7e8" stroke-width="7"/><rect x="480" y="265" width="150" height="130" rx="16" fill="#1a2028" stroke="#dfe6ee" stroke-width="3"/><text x="555" y="342" text-anchor="middle" fill="#f6f8fb" font-size="28" font-family="sans-serif">m</text><line x1="555" y1="235" x2="430" y2="235" stroke="#ff9f1c" stroke-width="7" marker-end="url(#o)"/><text x="470" y="210" fill="#ff9f1c" font-size="21" font-family="sans-serif">F_s</text><line x1="480" y1="450" x2="630" y2="450" stroke="#66717f" stroke-width="3"/><line x1="480" y1="435" x2="480" y2="465" stroke="#66717f" stroke-width="3"/><line x1="630" y1="435" x2="630" y2="465" stroke="#66717f" stroke-width="3"/><text x="555" y="485" fill="#8d98a6" font-size="20" text-anchor="middle" font-family="sans-serif">x</text><g transform="translate(785 185)"><line x1="0" y1="300" x2="300" y2="300" stroke="#66717f" stroke-width="3"/><line x1="150" y1="0" x2="150" y2="420" stroke="#66717f" stroke-width="3"/><line x1="35" y1="375" x2="265" y2="45" stroke="#56d7e8" stroke-width="6"/><text x="278" y="55" fill="#56d7e8" font-size="19" font-family="sans-serif">F</text><text x="285" y="325" fill="#8d98a6" font-size="19" font-family="sans-serif">x</text><text x="165" y="25" fill="#8d98a6" font-size="17" font-family="sans-serif">回復力方向與位移相反</text></g><text x="70" y="610" fill="#8d98a6" font-size="18" font-family="sans-serif">線性範圍內，斜率大小對應彈簧常數 k；超過彈性限度時不再適用。</text></svg>