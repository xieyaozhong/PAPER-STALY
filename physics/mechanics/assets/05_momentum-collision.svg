<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">動量與碰撞</title><desc id="d">顯示一維碰撞前後兩物體的速度與動量守恆概念。</desc><defs><marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#56d7e8"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ff9f1c"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="70" fill="#f6f8fb" font-size="36" font-family="sans-serif" font-weight="700">動量與碰撞｜系統動量守恆</text><text x="70" y="108" fill="#8d98a6" font-size="18" font-family="monospace">MECHANICS · MOMENTUM / COLLISION</text><text x="85" y="190" fill="#56d7e8" font-size="24" font-family="sans-serif" font-weight="700">碰撞前</text><line x1="80" y1="360" x2="540" y2="360" stroke="#66717f" stroke-width="3"/><circle cx="210" cy="320" r="58" fill="#dfe6ee"/><circle cx="420" cy="320" r="42" fill="#8d98a6"/><text x="210" y="327" text-anchor="middle" fill="#0b0d10" font-size="20" font-family="sans-serif">m₁</text><text x="420" y="327" text-anchor="middle" fill="#0b0d10" font-size="18" font-family="sans-serif">m₂</text><line x1="260" y1="260" x2="365" y2="260" stroke="#56d7e8" stroke-width="6" marker-end="url(#c)"/><text x="305" y="240" fill="#56d7e8" font-size="19" font-family="sans-serif">v₁ᵢ</text><line x1="465" y1="260" x2="510" y2="260" stroke="#ff9f1c" stroke-width="5" marker-end="url(#o)"/><text x="475" y="240" fill="#ff9f1c" font-size="19" font-family="sans-serif">v₂ᵢ</text><text x="665" y="190" fill="#56d7e8" font-size="24" font-family="sans-serif" font-weight="700">碰撞後</text><line x1="640" y1="360" x2="1120" y2="360" stroke="#66717f" stroke-width="3"/><circle cx="790" cy="320" r="58" fill="#dfe6ee"/><circle cx="900" cy="320" r="42" fill="#8d98a6"/><line x1="845" y1="255" x2="960" y2="255" stroke="#56d7e8" stroke-width="6" marker-end="url(#c)"/><text x="885" y="235" fill="#56d7e8" font-size="19" font-family="sans-serif">v₁f</text><line x1="940" y1="400" x2="1030" y2="400" stroke="#ff9f1c" stroke-width="5" marker-end="url(#o)"/><text x="970" y="430" fill="#ff9f1c" font-size="19" font-family="sans-serif">v₂f</text><rect x="210" y="470" width="780" height="105" rx="18" fill="#12161c" stroke="#39424e"/><text x="600" y="515" fill="#f6f8fb" font-size="26" text-anchor="middle" font-family="sans-serif">m₁v₁ᵢ + m₂v₂ᵢ = m₁v₁f + m₂v₂f</text><text x="600" y="550" fill="#8d98a6" font-size="17" text-anchor="middle" font-family="sans-serif">孤立系統：外力衝量可忽略時，總動量守恆。</text></svg>