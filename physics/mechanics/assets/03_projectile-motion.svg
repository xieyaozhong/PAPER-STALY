<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">拋體運動</title><desc id="d">顯示拋體的拋物線軌跡、初速度水平與垂直分量，以及重力加速度方向。</desc><defs><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ff9f1c"/></marker><marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#56d7e8"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="70" fill="#f6f8fb" font-size="36" font-family="sans-serif" font-weight="700">拋體運動｜水平與垂直分開看</text><text x="70" y="108" fill="#8d98a6" font-size="18" font-family="monospace">MECHANICS · PROJECTILE MOTION</text><line x1="110" y1="540" x2="1080" y2="540" stroke="#66717f" stroke-width="3"/><line x1="150" y1="560" x2="150" y2="170" stroke="#66717f" stroke-width="3"/><path d="M160 510 Q475 115 920 510" fill="none" stroke="#56d7e8" stroke-width="6" stroke-dasharray="12 9"/><circle cx="160" cy="510" r="16" fill="#f6f8fb"/><line x1="160" y1="510" x2="300" y2="405" stroke="#56d7e8" stroke-width="7" marker-end="url(#c)"/><text x="275" y="385" fill="#56d7e8" font-size="22" font-family="sans-serif">v₀</text><line x1="160" y1="510" x2="300" y2="510" stroke="#56d7e8" stroke-width="5" marker-end="url(#c)"/><text x="235" y="535" fill="#56d7e8" font-size="19" font-family="sans-serif">v₀ cosθ</text><line x1="160" y1="510" x2="160" y2="395" stroke="#56d7e8" stroke-width="5" marker-end="url(#c)"/><text x="80" y="405" fill="#56d7e8" font-size="19" font-family="sans-serif">v₀ sinθ</text><line x1="610" y1="220" x2="610" y2="330" stroke="#ff9f1c" stroke-width="7" marker-end="url(#o)"/><text x="635" y="305" fill="#ff9f1c" font-size="22" font-family="sans-serif">g</text><rect x="770" y="165" width="330" height="240" rx="18" fill="#12161c" stroke="#39424e"/><text x="805" y="215" fill="#56d7e8" font-size="23" font-family="sans-serif" font-weight="700">理想模型</text><text x="805" y="265" fill="#f6f8fb" font-size="20" font-family="sans-serif">水平：等速度</text><text x="805" y="310" fill="#f6f8fb" font-size="20" font-family="sans-serif">垂直：等加速度</text><text x="805" y="355" fill="#8d98a6" font-size="18" font-family="sans-serif">忽略空氣阻力；落地高度與發射高度相同。</text><text x="70" y="625" fill="#8d98a6" font-size="18" font-family="sans-serif">軌跡是兩個互相獨立分量同時作用的結果。</text></svg>