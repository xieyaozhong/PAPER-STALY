<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">牛頓第二定律</title><desc id="d">水平外力作用在方塊上，顯示淨力與加速度同方向，並比較不同質量下的加速度。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ff9f1c"/></marker><marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#56d7e8"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="70" fill="#f6f8fb" font-size="36" font-family="sans-serif" font-weight="700">牛頓第二定律｜Fₙₑₜ = ma</text><text x="70" y="108" fill="#8d98a6" font-size="18" font-family="monospace">MECHANICS · FORCE → ACCELERATION</text><line x1="80" y1="505" x2="1120" y2="505" stroke="#66717f" stroke-width="4"/><rect x="370" y="360" width="270" height="145" rx="18" fill="#1a2028" stroke="#dfe6ee" stroke-width="3"/><text x="505" y="440" fill="#f6f8fb" font-size="32" text-anchor="middle" font-family="sans-serif">m</text><line x1="260" y1="405" x2="355" y2="405" stroke="#ff9f1c" stroke-width="8" marker-end="url(#a)"/><text x="250" y="385" fill="#ff9f1c" font-size="22" text-anchor="end" font-family="sans-serif">Fₙₑₜ</text><line x1="650" y1="330" x2="800" y2="330" stroke="#56d7e8" stroke-width="7" marker-end="url(#c)"/><text x="720" y="305" fill="#56d7e8" font-size="22" font-family="sans-serif">a</text><rect x="820" y="175" width="300" height="230" rx="18" fill="#12161c" stroke="#39424e"/><text x="850" y="220" fill="#56d7e8" font-size="22" font-family="sans-serif" font-weight="700">同樣淨力時</text><text x="850" y="270" fill="#f6f8fb" font-size="20" font-family="sans-serif">質量較小 → 加速度較大</text><text x="850" y="315" fill="#f6f8fb" font-size="20" font-family="sans-serif">質量較大 → 加速度較小</text><text x="850" y="365" fill="#8d98a6" font-size="18" font-family="sans-serif">方向：a 與 Fₙₑₜ 同向</text><text x="70" y="610" fill="#8d98a6" font-size="18" font-family="sans-serif">概念示意：只畫淨水平外力；若需要完整受力，搭配自由體圖模板使用。</text></svg>