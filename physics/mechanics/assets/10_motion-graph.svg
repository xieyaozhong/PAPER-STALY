<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">運動圖像判讀</title><desc id="d">並列位置時間、速度時間與加速度時間圖，示範等加速度運動的三圖關係。</desc><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="70" fill="#f6f8fb" font-size="36" font-family="sans-serif" font-weight="700">運動圖像｜x–t、v–t、a–t 對照</text><text x="70" y="108" fill="#8d98a6" font-size="18" font-family="monospace">MECHANICS · KINEMATICS GRAPHS</text><g transform="translate(90 175)" font-family="sans-serif"><g><text x="0" y="0" fill="#56d7e8" font-size="22" font-weight="700">位置－時間</text><line x1="0" y1="290" x2="300" y2="290" stroke="#66717f" stroke-width="3"/><line x1="0" y1="290" x2="0" y2="40" stroke="#66717f" stroke-width="3"/><path d="M15 275 Q120 230 285 55" fill="none" stroke="#56d7e8" stroke-width="6"/><text x="285" y="315" fill="#8d98a6" font-size="16">t</text><text x="-18" y="48" fill="#8d98a6" font-size="16">x</text></g><g transform="translate(380 0)"><text x="0" y="0" fill="#ff9f1c" font-size="22" font-weight="700">速度－時間</text><line x1="0" y1="290" x2="300" y2="290" stroke="#66717f" stroke-width="3"/><line x1="0" y1="290" x2="0" y2="40" stroke="#66717f" stroke-width="3"/><line x1="20" y1="250" x2="285" y2="75" stroke="#ff9f1c" stroke-width="6"/><text x="285" y="315" fill="#8d98a6" font-size="16">t</text><text x="-18" y="48" fill="#8d98a6" font-size="16">v</text></g><g transform="translate(760 0)"><text x="0" y="0" fill="#dfe6ee" font-size="22" font-weight="700">加速度－時間</text><line x1="0" y1="290" x2="300" y2="290" stroke="#66717f" stroke-width="3"/><line x1="0" y1="290" x2="0" y2="40" stroke="#66717f" stroke-width="3"/><line x1="20" y1="130" x2="285" y2="130" stroke="#dfe6ee" stroke-width="6"/><text x="285" y="315" fill="#8d98a6" font-size="16">t</text><text x="-18" y="48" fill="#8d98a6" font-size="16">a</text></g></g><rect x="170" y="525" width="860" height="85" rx="18" fill="#12161c" stroke="#39424e"/><text x="600" y="563" text-anchor="middle" fill="#f6f8fb" font-size="21" font-family="sans-serif">斜率鏈：x–t 的斜率 = v；v–t 的斜率 = a</text><text x="600" y="592" text-anchor="middle" fill="#8d98a6" font-size="17" font-family="sans-serif">面積也有意義：v–t 面積對應位移，a–t 面積對應速度變化。</text></svg>