<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">機械能轉換</title><desc id="d">球在無摩擦U形軌道上運動，重力位能與動能互相轉換，總機械能保持不變。</desc><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="70" fill="#f6f8fb" font-size="36" font-family="sans-serif" font-weight="700">機械能轉換｜PE ↔ KE</text><text x="70" y="108" fill="#8d98a6" font-size="18" font-family="monospace">MECHANICS · CONSERVATION OF ENERGY</text><path d="M150 235 Q300 570 600 570 Q900 570 1050 235" fill="none" stroke="#66717f" stroke-width="12" stroke-linecap="round"/><circle cx="205" cy="305" r="28" fill="#dfe6ee"/><circle cx="600" cy="542" r="28" fill="#dfe6ee"/><circle cx="995" cy="305" r="28" fill="#dfe6ee"/><text x="190" y="205" fill="#ff9f1c" font-size="23" font-family="sans-serif">位能高</text><text x="515" y="485" fill="#56d7e8" font-size="23" font-family="sans-serif">動能高</text><text x="930" y="205" fill="#ff9f1c" font-size="23" font-family="sans-serif">位能高</text><rect x="350" y="160" width="500" height="150" rx="18" fill="#12161c" stroke="#39424e"/><text x="600" y="215" text-anchor="middle" fill="#f6f8fb" font-size="29" font-family="sans-serif">E_total = PE + KE</text><text x="600" y="260" text-anchor="middle" fill="#8d98a6" font-size="19" font-family="sans-serif">忽略摩擦時，總機械能保持不變。</text><g font-family="sans-serif" font-size="18"><text x="115" y="620" fill="#8d98a6">最高點：v ≈ 0，PE 最大</text><text x="475" y="620" fill="#8d98a6">最低點：速度最大，KE 最大</text><text x="875" y="620" fill="#8d98a6">對稱高度：速率相同</text></g></svg>