<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">條形磁鐵磁場</title><desc id="d">條形磁鐵外部磁力線由 N 極指向 S 極。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#6ed4ff"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="72" fill="#f5f7fa" font-size="34" font-family="sans-serif" font-weight="700">條形磁鐵｜Magnetic Field</text><rect x="405" y="270" width="195" height="130" rx="12" fill="#ffb25b"/><rect x="600" y="270" width="195" height="130" rx="12" fill="#6ed4ff"/><text x="502" y="350" text-anchor="middle" fill="#0b0d10" font-size="40" font-family="sans-serif" font-weight="700">N</text><text x="697" y="350" text-anchor="middle" fill="#0b0d10" font-size="40" font-family="sans-serif" font-weight="700">S</text><g fill="none" stroke="#6ed4ff" stroke-width="3"><path d="M450 260 C330 120 870 120 750 260" marker-end="url(#a)"/><path d="M420 245 C230 65 970 65 780 245" marker-end="url(#a)"/><path d="M450 410 C330 550 870 550 750 410" marker-end="url(#a)"/><path d="M420 425 C230 605 970 605 780 425" marker-end="url(#a)"/></g><text x="600" y="160" text-anchor="middle" fill="#f5f7fa" font-size="21" font-family="sans-serif">磁鐵外部：N → S</text><text x="70" y="620" fill="#9aa6b2" font-size="17" font-family="sans-serif">磁力線形成閉合曲線；線越密代表磁場越強。</text></svg>