<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">電場線</title><desc id="d">正負點電荷之間電場線由正指向負。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#6ed4ff"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="72" fill="#f5f7fa" font-size="34" font-family="sans-serif" font-weight="700">電場線｜Electric Field Lines</text><circle cx="350" cy="340" r="55" fill="#ffb25b"/><circle cx="850" cy="340" r="55" fill="#6ed4ff"/><text x="350" y="351" text-anchor="middle" fill="#0b0d10" font-size="38" font-family="sans-serif" font-weight="700">+</text><text x="850" y="351" text-anchor="middle" fill="#0b0d10" font-size="38" font-family="sans-serif" font-weight="700">−</text><g fill="none" stroke="#6ed4ff" stroke-width="3"><path d="M405 340 C540 340 660 340 795 340" marker-end="url(#a)"/><path d="M395 300 C520 190 680 190 805 300" marker-end="url(#a)"/><path d="M395 380 C520 490 680 490 805 380" marker-end="url(#a)"/><path d="M380 286 C470 110 730 110 820 286" marker-end="url(#a)"/><path d="M380 394 C470 570 730 570 820 394" marker-end="url(#a)"/></g><text x="600" y="170" text-anchor="middle" fill="#f5f7fa" font-size="22" font-family="sans-serif">場線由正電荷出發，終止於負電荷</text><text x="70" y="585" fill="#9aa6b2" font-size="17" font-family="sans-serif">場線越密代表場越強；場線不會互相交叉。</text></svg>