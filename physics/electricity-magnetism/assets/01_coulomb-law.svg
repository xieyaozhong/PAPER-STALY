<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">庫侖力</title><desc id="d">兩點電荷間庫侖力大小與方向示意。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#d9e0e7"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="72" fill="#f5f7fa" font-size="34" font-family="sans-serif" font-weight="700">庫侖力｜Coulomb Force</text><text x="70" y="110" fill="#9aa6b2" font-size="18" font-family="monospace">F = k |q₁q₂| / r²</text><line x1="260" y1="335" x2="940" y2="335" stroke="#39424e" stroke-width="3" stroke-dasharray="8 8"/><circle cx="340" cy="335" r="62" fill="#ffb25b"/><circle cx="860" cy="335" r="62" fill="#6ed4ff"/><text x="340" y="345" text-anchor="middle" fill="#0b0d10" font-size="34" font-family="sans-serif" font-weight="700">+q₁</text><text x="860" y="345" text-anchor="middle" fill="#0b0d10" font-size="34" font-family="sans-serif" font-weight="700">−q₂</text><line x1="420" y1="260" x2="770" y2="260" stroke="#d9e0e7" stroke-width="5" marker-end="url(#a)"/><line x1="780" y1="410" x2="430" y2="410" stroke="#d9e0e7" stroke-width="5" marker-end="url(#a)"/><text x="600" y="235" text-anchor="middle" fill="#f5f7fa" font-size="22" font-family="sans-serif">吸引力</text><line x1="340" y1="500" x2="860" y2="500" stroke="#9aa6b2" stroke-width="2"/><line x1="340" y1="485" x2="340" y2="515" stroke="#9aa6b2" stroke-width="2"/><line x1="860" y1="485" x2="860" y2="515" stroke="#9aa6b2" stroke-width="2"/><text x="600" y="540" text-anchor="middle" fill="#6ed4ff" font-size="22" font-family="sans-serif">距離 r 增加 → 力快速減小</text><text x="70" y="620" fill="#9aa6b2" font-size="16" font-family="sans-serif">異號相吸、同號相斥；兩力大小相等、方向相反。</text></svg>