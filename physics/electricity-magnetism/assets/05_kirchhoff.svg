<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Kirchhoff 定律</title><desc id="d">以接點與閉合迴路示意電流守恆與電壓總和。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#6ed4ff"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="72" fill="#f5f7fa" font-size="34" font-family="sans-serif" font-weight="700">Kirchhoff 定律</text><rect x="70" y="145" width="480" height="390" rx="18" fill="#12161c" stroke="#6ed4ff" stroke-width="2"/><text x="105" y="190" fill="#6ed4ff" font-size="25" font-family="sans-serif" font-weight="700">接點定律｜ΣIin = ΣIout</text><circle cx="310" cy="335" r="16" fill="#f5f7fa"/><g stroke="#6ed4ff" stroke-width="5" marker-end="url(#a)"><line x1="120" y1="250" x2="285" y2="325"/><line x1="120" y1="420" x2="285" y2="345"/><line x1="335" y1="335" x2="500" y2="335"/></g><text x="145" y="235" fill="#f5f7fa" font-size="18" font-family="sans-serif">I₁</text><text x="145" y="445" fill="#f5f7fa" font-size="18" font-family="sans-serif">I₂</text><text x="455" y="315" fill="#f5f7fa" font-size="18" font-family="sans-serif">I₃</text><rect x="650" y="145" width="480" height="390" rx="18" fill="#12161c" stroke="#ffb25b" stroke-width="2"/><text x="685" y="190" fill="#ffb25b" font-size="25" font-family="sans-serif" font-weight="700">迴路定律｜ΣΔV = 0</text><rect x="735" y="245" width="310" height="190" fill="none" stroke="#d9e0e7" stroke-width="4"/><rect x="835" y="220" width="90" height="50" fill="#12161c" stroke="#6ed4ff" stroke-width="4"/><line x1="760" y1="405" x2="760" y2="455" stroke="#ffb25b" stroke-width="4"/><line x1="790" y1="415" x2="790" y2="445" stroke="#ffb25b" stroke-width="4"/><path d="M705 340 A185 125 0 0 1 1035 300" fill="none" stroke="#ffb25b" stroke-width="4" marker-end="url(#a)"/><text x="880" y="500" text-anchor="middle" fill="#f5f7fa" font-size="19" font-family="sans-serif">沿封閉路徑電位升降總和為 0</text><text x="70" y="615" fill="#9aa6b2" font-size="17" font-family="sans-serif">Kirchhoff 定律是電荷守恆與能量守恆在電路中的表現。</text></svg>