<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">洛倫茲力</title><desc id="d">帶正電粒子在均勻磁場中受力方向示意。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#d9e0e7"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="72" fill="#f5f7fa" font-size="34" font-family="sans-serif" font-weight="700">洛倫茲力｜Lorentz Force</text><text x="70" y="110" fill="#9aa6b2" font-size="18" font-family="monospace">F = q v × B</text><g fill="#6ed4ff" font-size="28" font-family="sans-serif"><text x="245" y="245">×</text><text x="355" y="245">×</text><text x="465" y="245">×</text><text x="575" y="245">×</text><text x="685" y="245">×</text><text x="795" y="245">×</text><text x="245" y="355">×</text><text x="355" y="355">×</text><text x="465" y="355">×</text><text x="575" y="355">×</text><text x="685" y="355">×</text><text x="795" y="355">×</text></g><circle cx="500" cy="430" r="42" fill="#ffb25b"/><text x="500" y="440" text-anchor="middle" fill="#0b0d10" font-size="26" font-family="sans-serif" font-weight="700">+q</text><line x1="550" y1="430" x2="850" y2="430" stroke="#d9e0e7" stroke-width="5" marker-end="url(#a)"/><text x="715" y="405" fill="#f5f7fa" font-size="22" font-family="sans-serif">v</text><line x1="500" y1="380" x2="500" y2="155" stroke="#ffb25b" stroke-width="5" marker-end="url(#a)"/><text x="525" y="180" fill="#ffb25b" font-size="22" font-family="sans-serif">F</text><text x="885" y="290" fill="#6ed4ff" font-size="22" font-family="sans-serif">× 表示 B 進入紙面</text><text x="70" y="615" fill="#9aa6b2" font-size="17" font-family="sans-serif">正電荷依右手定則；負電荷受力方向相反。磁力永遠垂直於 v 與 B。</text></svg>