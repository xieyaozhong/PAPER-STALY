<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">載流導線周圍磁場</title><desc id="d">直導線電流與環形磁場方向示意。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#6ed4ff"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="72" fill="#f5f7fa" font-size="34" font-family="sans-serif" font-weight="700">載流直導線｜Magnetic Field Around a Wire</text><line x1="600" y1="165" x2="600" y2="525" stroke="#ffb25b" stroke-width="18"/><path d="M600 480 L575 440 L625 440 Z" fill="#ffb25b"/><text x="635" y="230" fill="#ffb25b" font-size="22" font-family="sans-serif">I</text><g fill="none" stroke="#6ed4ff" stroke-width="4"><ellipse cx="600" cy="335" rx="150" ry="55"/><ellipse cx="600" cy="335" rx="260" ry="95"/><ellipse cx="600" cy="335" rx="370" ry="135"/></g><path d="M742 315 C750 340 740 365 715 380" fill="none" stroke="#6ed4ff" stroke-width="4" marker-end="url(#a)"/><path d="M847 300 C865 345 845 390 810 410" fill="none" stroke="#6ed4ff" stroke-width="4" marker-end="url(#a)"/><text x="815" y="505" fill="#f5f7fa" font-size="20" font-family="sans-serif">B 環繞導線</text><text x="70" y="620" fill="#9aa6b2" font-size="17" font-family="sans-serif">右手定則：拇指指電流方向，彎曲四指即磁場環繞方向。</text></svg>