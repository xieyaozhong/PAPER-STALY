<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">法拉第電磁感應</title><desc id="d">磁鐵靠近線圈造成磁通量改變並產生感應電流。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#d9e0e7"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="72" fill="#f5f7fa" font-size="34" font-family="sans-serif" font-weight="700">法拉第定律｜Electromagnetic Induction</text><text x="70" y="110" fill="#9aa6b2" font-size="18" font-family="monospace">ε = − dΦB / dt</text><rect x="165" y="275" width="150" height="120" rx="12" fill="#ffb25b"/><rect x="315" y="275" width="150" height="120" rx="12" fill="#6ed4ff"/><text x="240" y="347" text-anchor="middle" fill="#0b0d10" font-size="34" font-family="sans-serif" font-weight="700">N</text><text x="390" y="347" text-anchor="middle" fill="#0b0d10" font-size="34" font-family="sans-serif" font-weight="700">S</text><line x1="470" y1="335" x2="590" y2="335" stroke="#d9e0e7" stroke-width="5" marker-end="url(#a)"/><text x="530" y="310" text-anchor="middle" fill="#f5f7fa" font-size="20" font-family="sans-serif">移動</text><g fill="none" stroke="#6ed4ff" stroke-width="6"><ellipse cx="760" cy="335" rx="85" ry="155"/><ellipse cx="800" cy="335" rx="85" ry="155"/><ellipse cx="840" cy="335" rx="85" ry="155"/></g><path d="M925 335 C1015 335 1015 485 925 485" fill="none" stroke="#d9e0e7" stroke-width="5"/><circle cx="960" cy="485" r="35" fill="none" stroke="#ffb25b" stroke-width="4"/><text x="960" y="493" text-anchor="middle" fill="#ffb25b" font-size="22" font-family="sans-serif">G</text><path d="M760 180 C860 160 925 215 940 285" fill="none" stroke="#ffb25b" stroke-width="4" marker-end="url(#a)"/><text x="875" y="165" fill="#ffb25b" font-size="20" font-family="sans-serif">感應電流</text><text x="70" y="585" fill="#f5f7fa" font-size="20" font-family="sans-serif">關鍵：不是「有磁場」就有電流，而是磁通量必須改變。</text><text x="70" y="620" fill="#9aa6b2" font-size="17" font-family="sans-serif">負號代表楞次定律：感應效應會反抗造成磁通改變的原因。</text></svg>