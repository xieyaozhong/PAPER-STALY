<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">平行板電容器</title><desc id="d">平行板電容器的電荷、電場與電位差概念示意。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#6ed4ff"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="72" fill="#f5f7fa" font-size="34" font-family="sans-serif" font-weight="700">平行板電容器｜Capacitor</text><text x="70" y="110" fill="#9aa6b2" font-size="18" font-family="monospace">C = Q / V</text><rect x="360" y="185" width="45" height="310" fill="#ffb25b"/><rect x="795" y="185" width="45" height="310" fill="#6ed4ff"/><text x="382" y="165" text-anchor="middle" fill="#ffb25b" font-size="22" font-family="sans-serif">+Q</text><text x="818" y="165" text-anchor="middle" fill="#6ed4ff" font-size="22" font-family="sans-serif">−Q</text><g stroke="#6ed4ff" stroke-width="4" marker-end="url(#a)"><line x1="430" y1="235" x2="760" y2="235"/><line x1="430" y1="300" x2="760" y2="300"/><line x1="430" y1="365" x2="760" y2="365"/><line x1="430" y1="430" x2="760" y2="430"/></g><text x="600" y="525" text-anchor="middle" fill="#f5f7fa" font-size="22" font-family="sans-serif">近似均勻電場 E</text><line x1="405" y1="555" x2="795" y2="555" stroke="#9aa6b2" stroke-width="2"/><line x1="405" y1="540" x2="405" y2="570" stroke="#9aa6b2" stroke-width="2"/><line x1="795" y1="540" x2="795" y2="570" stroke="#9aa6b2" stroke-width="2"/><text x="600" y="590" text-anchor="middle" fill="#9aa6b2" font-size="18" font-family="sans-serif">板距 d</text><text x="70" y="625" fill="#9aa6b2" font-size="16" font-family="sans-serif">理想平行板：場方向由正板指向負板；邊緣效應此圖省略。</text></svg>