<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">串聯與並聯電路</title><desc id="d">比較串聯與並聯電路的電流與電壓特性。</desc><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="72" fill="#f5f7fa" font-size="34" font-family="sans-serif" font-weight="700">串聯 vs. 並聯｜Series &amp; Parallel</text><g font-family="sans-serif"><rect x="70" y="145" width="500" height="390" rx="18" fill="#12161c" stroke="#ffb25b" stroke-width="2"/><text x="105" y="190" fill="#ffb25b" font-size="26" font-weight="700">串聯</text><line x1="150" y1="290" x2="490" y2="290" stroke="#d9e0e7" stroke-width="4"/><rect x="220" y="255" width="90" height="70" fill="none" stroke="#6ed4ff" stroke-width="4"/><rect x="365" y="255" width="90" height="70" fill="none" stroke="#6ed4ff" stroke-width="4"/><line x1="150" y1="290" x2="150" y2="410" stroke="#d9e0e7" stroke-width="4"/><line x1="490" y1="290" x2="490" y2="410" stroke="#d9e0e7" stroke-width="4"/><line x1="150" y1="410" x2="285" y2="410" stroke="#d9e0e7" stroke-width="4"/><line x1="345" y1="410" x2="490" y2="410" stroke="#d9e0e7" stroke-width="4"/><line x1="300" y1="380" x2="300" y2="440" stroke="#ffb25b" stroke-width="4"/><line x1="330" y1="390" x2="330" y2="430" stroke="#ffb25b" stroke-width="4"/><text x="115" y="485" fill="#d9e0e7" font-size="19">I 相同；V 分配</text><rect x="630" y="145" width="500" height="390" rx="18" fill="#12161c" stroke="#6ed4ff" stroke-width="2"/><text x="665" y="190" fill="#6ed4ff" font-size="26" font-weight="700">並聯</text><line x1="710" y1="265" x2="1050" y2="265" stroke="#d9e0e7" stroke-width="4"/><line x1="710" y1="385" x2="1050" y2="385" stroke="#d9e0e7" stroke-width="4"/><line x1="710" y1="265" x2="710" y2="385" stroke="#d9e0e7" stroke-width="4"/><line x1="1050" y1="265" x2="1050" y2="385" stroke="#d9e0e7" stroke-width="4"/><line x1="825" y1="265" x2="825" y2="385" stroke="#d9e0e7" stroke-width="4"/><rect x="785" y="295" width="80" height="60" fill="#12161c" stroke="#ffb25b" stroke-width="4"/><line x1="955" y1="265" x2="955" y2="385" stroke="#d9e0e7" stroke-width="4"/><rect x="915" y="295" width="80" height="60" fill="#12161c" stroke="#ffb25b" stroke-width="4"/><line x1="735" y1="325" x2="735" y2="420" stroke="#ffb25b" stroke-width="4"/><line x1="765" y1="335" x2="765" y2="410" stroke="#ffb25b" stroke-width="4"/><text x="675" y="485" fill="#d9e0e7" font-size="19">V 相同；I 分流</text></g><text x="70" y="610" fill="#9aa6b2" font-size="17" font-family="sans-serif">串聯總電阻相加；並聯總電導相加。圖為概念骨架，可直接加題目數值。</text></svg>