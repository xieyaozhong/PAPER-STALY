<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">等位線與電場</title><desc id="d">點電荷周圍等位線與電場方向互相垂直。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#ffb25b"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="72" fill="#f5f7fa" font-size="34" font-family="sans-serif" font-weight="700">等位線｜Equipotential</text><circle cx="600" cy="335" r="45" fill="#ffb25b"/><text x="600" y="347" text-anchor="middle" fill="#0b0d10" font-size="34" font-family="sans-serif" font-weight="700">+</text><g fill="none" stroke="#6ed4ff" stroke-width="3"><circle cx="600" cy="335" r="110"/><circle cx="600" cy="335" r="175"/><circle cx="600" cy="335" r="240"/></g><g stroke="#ffb25b" stroke-width="4" marker-end="url(#a)"><line x1="645" y1="335" x2="920" y2="335"/><line x1="555" y1="335" x2="280" y2="335"/><line x1="600" y1="290" x2="600" y2="90"/><line x1="600" y1="380" x2="600" y2="580"/></g><text x="870" y="300" fill="#ffb25b" font-size="20" font-family="sans-serif">電場 E</text><text x="785" y="515" fill="#6ed4ff" font-size="20" font-family="sans-serif">等位線 V = constant</text><text x="70" y="620" fill="#9aa6b2" font-size="17" font-family="sans-serif">沿等位線移動理想測試電荷，電場力不作功；電場方向與等位線垂直。</text></svg>