<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">加熱曲線</title><desc id="d">固體、熔化、液體、汽化、氣體的溫度與吸熱關係。</desc><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="70" fill="#f5f7fa" font-size="34" font-family="sans-serif" font-weight="700">加熱曲線｜Heating Curve</text><line x1="155" y1="545" x2="1050" y2="545" stroke="#d9e0e7" stroke-width="3"/><line x1="155" y1="545" x2="155" y2="145" stroke="#d9e0e7" stroke-width="3"/><text x="1060" y="555" fill="#9aa6b2" font-size="18" font-family="sans-serif">吸收熱量 Q</text><text x="95" y="135" fill="#9aa6b2" font-size="18" font-family="sans-serif">溫度 T</text><polyline points="190,500 340,380 520,380 690,265 870,265 1010,170" fill="none" stroke="#ffb25b" stroke-width="7"/><g fill="#f5f7fa" font-size="18" font-family="sans-serif"><text x="235" y="450">固體升溫</text><text x="390" y="355">熔化</text><text x="585" y="330">液體升溫</text><text x="755" y="240">汽化</text><text x="905" y="210">氣體升溫</text></g><g fill="#6ed4ff" font-size="17" font-family="sans-serif"><text x="385" y="420">相變：T 近似不變</text><text x="735" y="305">相變：T 近似不變</text></g><text x="70" y="615" fill="#9aa6b2" font-size="17" font-family="sans-serif">斜段：能量主要增加粒子平均動能；平台：能量主要用於改變相態。</text></svg>