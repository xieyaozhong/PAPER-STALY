<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">熱力學第一定律</title><desc id="d">系統內能、吸熱與作功的能量收支示意。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#d9e0e7"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="70" fill="#f5f7fa" font-size="34" font-family="sans-serif" font-weight="700">熱力學第一定律｜First Law</text><text x="70" y="110" fill="#9aa6b2" font-size="19" font-family="monospace">ΔU = Q − W</text><rect x="430" y="215" width="340" height="250" rx="28" fill="#12161c" stroke="#d9e0e7" stroke-width="3"/><text x="600" y="315" text-anchor="middle" fill="#f5f7fa" font-size="30" font-family="sans-serif" font-weight="700">SYSTEM</text><text x="600" y="365" text-anchor="middle" fill="#6ed4ff" font-size="24" font-family="sans-serif">內能 U</text><line x1="150" y1="340" x2="410" y2="340" stroke="#ffb25b" stroke-width="7" marker-end="url(#a)"/><text x="240" y="310" fill="#ffb25b" font-size="24" font-family="sans-serif">吸熱 Q</text><line x1="790" y1="340" x2="1050" y2="340" stroke="#6ed4ff" stroke-width="7" marker-end="url(#a)"/><text x="860" y="310" fill="#6ed4ff" font-size="24" font-family="sans-serif">系統作功 W</text><text x="70" y="575" fill="#f5f7fa" font-size="21" font-family="sans-serif">能量不會憑空產生或消失，只會在熱、功與系統內能之間轉換。</text><text x="70" y="615" fill="#9aa6b2" font-size="17" font-family="sans-serif">本圖採常見符號約定：W &gt; 0 表示系統對外作功。</text></svg>