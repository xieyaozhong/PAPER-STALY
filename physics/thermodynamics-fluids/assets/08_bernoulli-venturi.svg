<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">伯努力與文丘里效應</title><desc id="d">流管變窄時速度增加、靜壓降低的概念示意。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#6ed4ff"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="70" fill="#f5f7fa" font-size="34" font-family="sans-serif" font-weight="700">伯努力效應｜Venturi Flow</text><text x="70" y="110" fill="#9aa6b2" font-size="18" font-family="monospace">A₁v₁ = A₂v₂</text><path d="M110 245 C330 245 385 300 500 300 L700 300 C815 300 870 245 1090 245 L1090 425 C870 425 815 370 700 370 L500 370 C385 370 330 425 110 425 Z" fill="#6ed4ff" opacity=".18" stroke="#d9e0e7" stroke-width="3"/><g stroke="#6ed4ff" stroke-width="5" marker-end="url(#a)"><line x1="165" y1="335" x2="330" y2="335"/><line x1="445" y1="335" x2="640" y2="335"/><line x1="775" y1="335" x2="1000" y2="335"/></g><text x="225" y="305" fill="#f5f7fa" font-size="20" font-family="sans-serif">v₁ 較小</text><text x="535" y="270" fill="#ffb25b" font-size="20" font-family="sans-serif">v₂ 較大</text><line x1="260" y1="245" x2="260" y2="155" stroke="#d9e0e7" stroke-width="3"/><line x1="600" y1="300" x2="600" y2="205" stroke="#d9e0e7" stroke-width="3"/><rect x="235" y="115" width="50" height="40" fill="#ffb25b" opacity=".65"/><rect x="575" y="170" width="50" height="35" fill="#6ed4ff" opacity=".65"/><text x="205" y="105" fill="#f5f7fa" font-size="18" font-family="sans-serif">P₁ 較高</text><text x="545" y="160" fill="#f5f7fa" font-size="18" font-family="sans-serif">P₂ 較低</text><text x="70" y="560" fill="#f5f7fa" font-size="21" font-family="sans-serif">流管縮窄 → 為維持流量，速度上升；在同高度理想流中，靜壓下降。</text><text x="70" y="610" fill="#9aa6b2" font-size="17" font-family="sans-serif">此圖採穩定、不可壓縮、低黏滯流體的理想化條件。</text></svg>