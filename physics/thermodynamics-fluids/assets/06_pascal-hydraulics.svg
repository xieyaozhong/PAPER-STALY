<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">帕斯卡原理與液壓</title><desc id="d">小活塞施力透過液體壓力傳到大活塞放大輸出力。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#d9e0e7"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="70" fill="#f5f7fa" font-size="34" font-family="sans-serif" font-weight="700">帕斯卡原理｜Hydraulics</text><text x="70" y="110" fill="#9aa6b2" font-size="18" font-family="monospace">F₁/A₁ = F₂/A₂</text><path d="M245 310 L245 500 L935 500 L935 250" fill="none" stroke="#d9e0e7" stroke-width="16"/><path d="M260 325 L260 485 L920 485 L920 265" fill="none" stroke="#6ed4ff" stroke-width="26" opacity=".35"/><rect x="185" y="255" width="120" height="55" fill="#596270"/><rect x="825" y="195" width="220" height="55" fill="#596270"/><line x1="245" y1="150" x2="245" y2="245" stroke="#ffb25b" stroke-width="7" marker-end="url(#a)"/><text x="275" y="190" fill="#ffb25b" font-size="22" font-family="sans-serif">F₁</text><line x1="935" y1="300" x2="935" y2="145" stroke="#6ed4ff" stroke-width="7" marker-end="url(#a)"/><text x="965" y="180" fill="#6ed4ff" font-size="22" font-family="sans-serif">F₂</text><text x="175" y="350" fill="#f5f7fa" font-size="20" font-family="sans-serif">小面積 A₁</text><text x="820" y="295" fill="#f5f7fa" font-size="20" font-family="sans-serif">大面積 A₂</text><text x="510" y="440" fill="#f5f7fa" font-size="21" font-family="sans-serif">液體壓力傳遞</text><text x="70" y="615" fill="#9aa6b2" font-size="17" font-family="sans-serif">理想液壓可放大力，但必須以較大的輸入位移換取較小的輸出位移。</text></svg>