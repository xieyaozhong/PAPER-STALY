<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">P-V 圖</title><desc id="d">氣體膨脹時 P-V 圖下方面積代表作功。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#d9e0e7"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="70" fill="#f5f7fa" font-size="34" font-family="sans-serif" font-weight="700">P–V 圖｜Gas Work</text><line x1="170" y1="535" x2="1030" y2="535" stroke="#d9e0e7" stroke-width="3" marker-end="url(#a)"/><line x1="170" y1="535" x2="170" y2="145" stroke="#d9e0e7" stroke-width="3" marker-end="url(#a)"/><text x="1040" y="545" fill="#9aa6b2" font-size="20" font-family="sans-serif">V</text><text x="135" y="140" fill="#9aa6b2" font-size="20" font-family="sans-serif">P</text><path d="M270 240 C420 280 610 350 900 430 L900 535 L270 535 Z" fill="#ffb25b" opacity=".18"/><path d="M270 240 C420 280 610 350 900 430" fill="none" stroke="#6ed4ff" stroke-width="7" marker-end="url(#a)"/><circle cx="270" cy="240" r="10" fill="#ffb25b"/><circle cx="900" cy="430" r="10" fill="#ffb25b"/><text x="245" y="215" fill="#f5f7fa" font-size="20" font-family="sans-serif">A</text><text x="920" y="455" fill="#f5f7fa" font-size="20" font-family="sans-serif">B</text><text x="570" y="470" text-anchor="middle" fill="#ffb25b" font-size="24" font-family="sans-serif">面積 = W = ∫P dV</text><text x="70" y="610" fill="#9aa6b2" font-size="17" font-family="sans-serif">膨脹時 V 增加，氣體可對外作正功；壓縮則由外界對氣體作功。</text></svg>