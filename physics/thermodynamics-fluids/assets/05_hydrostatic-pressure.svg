<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">液體靜壓</title><desc id="d">液體壓力隨深度增加的概念示意。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#d9e0e7"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="70" fill="#f5f7fa" font-size="34" font-family="sans-serif" font-weight="700">液體靜壓｜Hydrostatic Pressure</text><text x="70" y="110" fill="#9aa6b2" font-size="18" font-family="monospace">P = P₀ + ρgh</text><rect x="300" y="155" width="420" height="390" rx="16" fill="#12161c" stroke="#d9e0e7" stroke-width="3"/><rect x="300" y="245" width="420" height="300" fill="#6ed4ff" opacity=".28"/><line x1="300" y1="245" x2="720" y2="245" stroke="#6ed4ff" stroke-width="4"/><line x1="760" y1="245" x2="760" y2="495" stroke="#d9e0e7" stroke-width="3" marker-end="url(#a)"/><text x="785" y="380" fill="#f5f7fa" font-size="22" font-family="sans-serif">h</text><g stroke="#ffb25b" stroke-width="5" marker-end="url(#a)"><line x1="420" y1="300" x2="485" y2="300"/><line x1="420" y1="390" x2="520" y2="390"/><line x1="420" y1="480" x2="570" y2="480"/></g><text x="820" y="315" fill="#f5f7fa" font-size="20" font-family="sans-serif">越深 → 壓力越大</text><text x="820" y="365" fill="#9aa6b2" font-size="18" font-family="sans-serif">同一深度壓力相同</text><text x="70" y="615" fill="#9aa6b2" font-size="17" font-family="sans-serif">靜止同種液體中，壓力差只由密度、重力與深度差決定。</text></svg>