<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">浮力與阿基米德原理</title><desc id="d">浸入液體中的物體受到向上浮力與向下重力。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#d9e0e7"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="70" fill="#f5f7fa" font-size="34" font-family="sans-serif" font-weight="700">浮力｜Archimedes' Principle</text><text x="70" y="110" fill="#9aa6b2" font-size="18" font-family="monospace">F_b = ρ_fluid g V_displaced</text><rect x="260" y="185" width="520" height="370" rx="16" fill="#12161c" stroke="#d9e0e7" stroke-width="3"/><rect x="260" y="285" width="520" height="270" fill="#6ed4ff" opacity=".28"/><line x1="260" y1="285" x2="780" y2="285" stroke="#6ed4ff" stroke-width="4"/><rect x="470" y="330" width="120" height="150" rx="12" fill="#596270" stroke="#d9e0e7" stroke-width="3"/><line x1="530" y1="325" x2="530" y2="185" stroke="#6ed4ff" stroke-width="7" marker-end="url(#a)"/><text x="555" y="220" fill="#6ed4ff" font-size="22" font-family="sans-serif">浮力 F_b</text><line x1="530" y1="485" x2="530" y2="595" stroke="#ffb25b" stroke-width="7" marker-end="url(#a)"/><text x="555" y="565" fill="#ffb25b" font-size="22" font-family="sans-serif">重力 mg</text><text x="835" y="300" fill="#f5f7fa" font-size="21" font-family="sans-serif">浮力大小</text><text x="835" y="340" fill="#9aa6b2" font-size="18" font-family="sans-serif">= 排開流體的重量</text><text x="835" y="405" fill="#f5f7fa" font-size="20" font-family="sans-serif">F_b &gt; mg：上浮</text><text x="835" y="445" fill="#f5f7fa" font-size="20" font-family="sans-serif">F_b = mg：平衡</text><text x="835" y="485" fill="#f5f7fa" font-size="20" font-family="sans-serif">F_b &lt; mg：下沉</text><text x="70" y="630" fill="#9aa6b2" font-size="17" font-family="sans-serif">浮力來自物體上下表面所受流體壓力差。</text></svg>