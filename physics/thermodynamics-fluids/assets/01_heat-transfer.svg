<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">熱傳三方式</title><desc id="d">傳導、對流與輻射的概念比較。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#d9e0e7"/></marker></defs><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="70" fill="#f5f7fa" font-size="34" font-family="sans-serif" font-weight="700">熱傳三方式｜Heat Transfer</text><g font-family="sans-serif"><rect x="55" y="145" width="340" height="390" rx="18" fill="#12161c" stroke="#ffb25b"/><text x="85" y="190" fill="#ffb25b" font-size="25" font-weight="700">1 傳導</text><rect x="105" y="285" width="220" height="45" fill="#596270"/><circle cx="105" cy="307" r="42" fill="#ffb25b"/><g stroke="#d9e0e7" stroke-width="3" marker-end="url(#a)"><line x1="155" y1="307" x2="205" y2="307"/><line x1="220" y1="307" x2="270" y2="307"/></g><text x="85" y="400" fill="#d9e0e7" font-size="18">粒子碰撞傳遞能量</text><rect x="430" y="145" width="340" height="390" rx="18" fill="#12161c" stroke="#6ed4ff"/><text x="460" y="190" fill="#6ed4ff" font-size="25" font-weight="700">2 對流</text><path d="M525 390 C495 300 575 250 610 300 C645 250 725 300 695 390" fill="none" stroke="#6ed4ff" stroke-width="5" marker-end="url(#a)"/><path d="M695 390 C715 450 500 450 525 390" fill="none" stroke="#ffb25b" stroke-width="5" marker-end="url(#a)"/><text x="460" y="475" fill="#d9e0e7" font-size="18">流體整體移動搬運熱量</text><rect x="805" y="145" width="340" height="390" rx="18" fill="#12161c" stroke="#ffb25b"/><text x="835" y="190" fill="#ffb25b" font-size="25" font-weight="700">3 輻射</text><circle cx="900" cy="335" r="55" fill="#ffb25b"/><g fill="none" stroke="#ffb25b" stroke-width="4"><path d="M970 285 q45 50 0 100"/><path d="M1010 255 q75 80 0 160"/></g><text x="835" y="475" fill="#d9e0e7" font-size="18">電磁波傳熱，不需介質</text></g><text x="70" y="615" fill="#9aa6b2" font-size="17" font-family="sans-serif">實際情境常同時包含多種熱傳方式。</text></svg>