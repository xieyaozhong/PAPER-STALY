<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="70" fill="#f6f8fb" font-size="36" font-family="sans-serif" font-weight="700">疊加原理｜波形可以相加</text><text x="70" y="108" fill="#8d98a6" font-size="18" font-family="monospace">WAVES · SUPERPOSITION</text><g transform="translate(80 180)"><text x="0" y="0" fill="#56d7e8" font-size="21" font-family="sans-serif">波 1</text><line x1="0" y1="100" x2="290" y2="100" stroke="#66717f"/><path d="M0 100 C55 20 110 20 165 100 S275 180 290 100" fill="none" stroke="#56d7e8" stroke-width="5"/></g><g transform="translate(80 380)"><text x="0" y="0" fill="#ff9f1c" font-size="21" font-family="sans-serif">波 2</text><line x1="0" y1="100" x2="290" y2="100" stroke="#66717f"/><path d="M0 100 C55 180 110 180 165 100 S275 20 290 100" fill="none" stroke="#ff9f1c" stroke-width="5"/></g><text x="430" y="340" fill="#f6f8fb" font-size="52" font-family="sans-serif">+</text><text x="560" y="340" fill="#f6f8fb" font-size="52" font-family="sans-serif">=</text><g transform="translate(690 260)"><text x="0" y="0" fill="#f6f8fb" font-size="21" font-family="sans-serif">合成波</text><line x1="0" y1="100" x2="390" y2="100" stroke="#66717f"/><path d="M0 100 C70 100 120 100 180 100 S300 100 390 100" fill="none" stroke="#dfe6ee" stroke-width="7"/><text x="0" y="170" fill="#8d98a6" font-size="18" font-family="sans-serif">兩波同時到達時，各點位移做代數相加。</text></g><text x="70" y="625" fill="#8d98a6" font-size="18" font-family="sans-serif">相長干涉：同向位移相加；相消干涉：反向位移互相抵銷。</text></svg>