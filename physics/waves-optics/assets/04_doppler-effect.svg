<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#0b0d10"/><text x="70" y="70" fill="#f6f8fb" font-size="36" font-family="sans-serif" font-weight="700">都卜勒效應｜前方壓縮，後方拉開</text><text x="70" y="108" fill="#8d98a6" font-size="18" font-family="monospace">WAVES · DOPPLER EFFECT</text><g fill="none" stroke="#56d7e8" stroke-width="3"><circle cx="560" cy="350" r="55"/><circle cx="525" cy="350" r="105"/><circle cx="490" cy="350" r="155"/><circle cx="455" cy="350" r="205"/><circle cx="420" cy="350" r="255"/></g><circle cx="600" cy="350" r="24" fill="#ff9f1c"/><line x1="600" y1="300" x2="780" y2="300" stroke="#ff9f1c" stroke-width="6"/><polygon points="780,300 760,290 760,310" fill="#ff9f1c"/><text x="675" y="280" fill="#ff9f1c" font-size="20" font-family="sans-serif">source velocity</text><circle cx="880" cy="350" r="20" fill="#f6f8fb"/><circle cx="155" cy="350" r="20" fill="#f6f8fb"/><text x="830" y="405" fill="#56d7e8" font-size="22" font-family="sans-serif">接近：波前密集</text><text x="830" y="440" fill="#f6f8fb" font-size="19" font-family="sans-serif">觀測頻率較高</text><text x="80" y="405" fill="#56d7e8" font-size="22" font-family="sans-serif">遠離：波前稀疏</text><text x="80" y="440" fill="#f6f8fb" font-size="19" font-family="sans-serif">觀測頻率較低</text><text x="70" y="610" fill="#8d98a6" font-size="18" font-family="sans-serif">聲源移動會改變接收者遇到波峰的頻率；波在介質中的傳播速率本身不因此改變。</text></svg>