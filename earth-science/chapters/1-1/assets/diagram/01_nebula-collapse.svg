<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">星雲收縮與旋轉示意</title>
  <desc id="desc">由稀疏星雲在重力作用下向中心收縮，旋轉加快並形成扁平原行星盤的概念圖。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d9e0e7"/></marker>
    <radialGradient id="cloud" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f5f7fa" stop-opacity=".55"/><stop offset="1" stop-color="#6ed4ff" stop-opacity=".05"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="#0b0d10"/>
  <text x="70" y="70" fill="#f5f7fa" font-size="34" font-family="sans-serif" font-weight="700">星雲收縮 → 原行星盤</text>
  <text x="70" y="108" fill="#9aa6b2" font-size="18" font-family="monospace" letter-spacing="2">DIAGRAM · GRAVITY + ROTATION</text>

  <g transform="translate(270 355)">
    <circle r="150" fill="url(#cloud)" stroke="#39424e" stroke-width="2"/>
    <g fill="#f5f7fa" opacity=".7">
      <circle cx="-90" cy="-35" r="5"/><circle cx="55" cy="-85" r="4"/><circle cx="80" cy="50" r="5"/><circle cx="-35" cy="95" r="4"/><circle cx="15" cy="20" r="5"/><circle cx="-120" cy="70" r="3"/><circle cx="115" cy="-20" r="3"/>
    </g>
    <line x1="-190" y1="0" x2="-120" y2="0" stroke="#d9e0e7" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="190" y1="0" x2="120" y2="0" stroke="#d9e0e7" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="0" y1="-190" x2="0" y2="-120" stroke="#d9e0e7" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="0" y1="190" x2="0" y2="120" stroke="#d9e0e7" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M-95,-120 A155,155 0 0 1 120,-95" fill="none" stroke="#6ed4ff" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="-74" y="185" fill="#9aa6b2" font-size="18" font-family="sans-serif">稀疏分子雲</text>
  </g>

  <line x1="480" y1="355" x2="610" y2="355" stroke="#d9e0e7" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="505" y="330" fill="#9aa6b2" font-size="16" font-family="sans-serif">收縮</text>

  <g transform="translate(870 355)">
    <ellipse rx="235" ry="70" fill="#12161c" stroke="#6ed4ff" stroke-width="3"/>
    <ellipse rx="165" ry="43" fill="none" stroke="#39424e" stroke-width="2"/>
    <ellipse rx="90" ry="22" fill="none" stroke="#39424e" stroke-width="2"/>
    <circle r="28" fill="#ffb25b"/>
    <path d="M-125,-86 A160,105 0 0 1 135,-74" fill="none" stroke="#6ed4ff" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="-80" y="145" fill="#9aa6b2" font-size="18" font-family="sans-serif">扁平原行星盤</text>
  </g>

  <text x="70" y="625" fill="#9aa6b2" font-size="16" font-family="sans-serif">概念示意：重力造成收縮；角動量守恆使旋轉加快，物質逐步形成盤面結構。</text>
</svg>