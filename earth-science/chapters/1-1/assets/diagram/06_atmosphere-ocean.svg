<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">早期大氣與海洋形成</title>
  <desc id="desc">從火山逸氣、氣體累積、地表冷卻、水氣凝結、降水到海洋累積的概念流程。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d9e0e7"/></marker></defs>
  <rect width="1200" height="675" fill="#0b0d10"/>
  <text x="70" y="70" fill="#f5f7fa" font-size="34" font-family="sans-serif" font-weight="700">冷卻中的地球：大氣與海洋</text>
  <text x="70" y="108" fill="#9aa6b2" font-size="18" font-family="monospace" letter-spacing="2">DIAGRAM · OUTGASSING → COOLING → CONDENSATION</text>

  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(145 330)">
      <path d="M-70,65 L-35,-20 L0,25 L35,-75 L70,65 Z" fill="#596270"/><path d="M22,-60 C5,-100 52,-120 30,-160 C70,-135 78,-90 58,-55" fill="none" stroke="#ffb25b" stroke-width="9" stroke-linecap="round"/>
      <text y="135" fill="#f5f7fa" font-size="18">火山逸氣</text>
    </g>
    <line x1="235" y1="330" x2="320" y2="330" stroke="#d9e0e7" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(405 330)">
      <circle r="76" fill="#596270"/><circle r="105" fill="none" stroke="#9aa6b2" stroke-width="12" opacity=".45"/>
      <text y="135" fill="#f5f7fa" font-size="18">氣體累積</text>
    </g>
    <line x1="505" y1="330" x2="590" y2="330" stroke="#d9e0e7" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(675 330)">
      <circle r="76" fill="#49515c"/><path d="M-60,-85 A105,105 0 0 1 60,-85" fill="none" stroke="#6ed4ff" stroke-width="8"/>
      <text y="135" fill="#f5f7fa" font-size="18">地表冷卻</text>
    </g>
    <line x1="770" y1="330" x2="855" y2="330" stroke="#d9e0e7" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(945 330)">
      <path d="M-65,-55 C-45,-95 0,-95 18,-65 C55,-78 82,-50 70,-22 C45,2 -45,0 -72,-18 C-82,-32 -78,-45 -65,-55 Z" fill="#6e7681"/>
      <g stroke="#6ed4ff" stroke-width="5" stroke-linecap="round"><line x1="-42" y1="8" x2="-52" y2="42"/><line x1="0" y1="8" x2="-10" y2="42"/><line x1="42" y1="8" x2="32" y2="42"/></g>
      <path d="M-86,70 Q0,40 86,70 L86,100 L-86,100 Z" fill="#6ed4ff" opacity=".75"/>
      <text y="145" fill="#f5f7fa" font-size="18">凝結、降水、成海</text>
    </g>
  </g>

  <text x="70" y="610" fill="#9aa6b2" font-size="16" font-family="sans-serif">概念流程：火山逸氣提供早期大氣來源之一；隨地表冷卻，水氣得以凝結並逐步形成海洋。</text>
</svg>