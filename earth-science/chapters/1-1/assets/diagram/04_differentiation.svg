<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">早期地球受熱與密度分異</title>
  <desc id="desc">左側顯示撞擊、壓縮與放射性衰變等熱源，右側顯示高密度物質下沉、低密度物質上浮形成分層。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d9e0e7"/></marker></defs>
  <rect width="1200" height="675" fill="#0b0d10"/>
  <text x="70" y="70" fill="#f5f7fa" font-size="34" font-family="sans-serif" font-weight="700">早期地球：受熱 → 分異</text>
  <text x="70" y="108" fill="#9aa6b2" font-size="18" font-family="monospace" letter-spacing="2">DIAGRAM · HEATING / DENSITY DIFFERENTIATION</text>

  <g font-family="sans-serif">
    <rect x="70" y="175" width="360" height="360" rx="18" fill="#12161c" stroke="#39424e"/>
    <text x="105" y="220" fill="#f5f7fa" font-size="22" font-weight="700">主要熱源</text>
    <g fill="#ffb25b"><circle cx="120" cy="290" r="18"/><circle cx="120" cy="365" r="18"/><circle cx="120" cy="440" r="18"/></g>
    <text x="160" y="297" fill="#d9e0e7" font-size="20">高速碰撞</text>
    <text x="160" y="372" fill="#d9e0e7" font-size="20">重力壓縮／位能轉熱</text>
    <text x="160" y="447" fill="#d9e0e7" font-size="20">放射性衰變</text>
    <line x1="455" y1="355" x2="560" y2="355" stroke="#d9e0e7" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(840 355)">
      <circle r="190" fill="#6f7782" stroke="#d9e0e7" stroke-width="2"/>
      <circle r="135" fill="#49515c"/>
      <circle r="78" fill="#ffb25b"/>
      <path d="M-95,-120 L-52,-70" stroke="#d9e0e7" stroke-width="4" marker-end="url(#arrow)"/>
      <path d="M95,-120 L52,-70" stroke="#d9e0e7" stroke-width="4" marker-end="url(#arrow)"/>
      <path d="M-55,70 L-100,125" stroke="#6ed4ff" stroke-width="4" marker-end="url(#arrow)"/>
      <path d="M55,70 L100,125" stroke="#6ed4ff" stroke-width="4" marker-end="url(#arrow)"/>
      <text x="-42" y="8" fill="#0b0d10" font-size="18" font-weight="700">高密度</text>
      <text x="-52" y="-155" fill="#f5f7fa" font-size="17">較低密度物質</text>
    </g>
  </g>
  <text x="70" y="610" fill="#9aa6b2" font-size="16" font-family="sans-serif">示意圖不按地球各層真實厚度比例；重點是熔融條件下的密度差造成分層。</text>
</svg>