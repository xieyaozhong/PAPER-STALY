<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">原行星盤、溫度梯度與雪線</title>
  <desc id="desc">顯示原行星盤由內向外溫度降低，雪線以外較多揮發物可凝結成固體的概念示意。</desc>
  <defs>
    <linearGradient id="temp" x1="0" x2="1"><stop offset="0" stop-color="#ffb25b"/><stop offset=".46" stop-color="#f0d7a1"/><stop offset="1" stop-color="#6ed4ff"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="#0b0d10"/>
  <text x="70" y="70" fill="#f5f7fa" font-size="34" font-family="sans-serif" font-weight="700">原行星盤：溫度決定材料</text>
  <text x="70" y="108" fill="#9aa6b2" font-size="18" font-family="monospace" letter-spacing="2">DIAGRAM · TEMPERATURE GRADIENT / SNOW LINE</text>

  <g transform="translate(600 300)">
    <ellipse rx="420" ry="105" fill="#12161c" stroke="#39424e" stroke-width="2"/>
    <ellipse rx="310" ry="74" fill="none" stroke="#39424e" stroke-width="2"/>
    <ellipse rx="190" ry="42" fill="none" stroke="#39424e" stroke-width="2"/>
    <circle r="42" fill="#ffb25b"/>
    <text x="-29" y="7" fill="#0b0d10" font-size="18" font-family="sans-serif" font-weight="700">SUN</text>
    <line x1="225" y1="-102" x2="225" y2="102" stroke="#6ed4ff" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="242" y="-84" fill="#6ed4ff" font-size="18" font-family="sans-serif">雪線</text>
    <g fill="#f5f7fa" opacity=".7">
      <circle cx="85" cy="18" r="4"/><circle cx="135" cy="-16" r="5"/><circle cx="-130" cy="9" r="4"/><circle cx="-82" cy="-12" r="4"/>
    </g>
    <g fill="#6ed4ff" opacity=".8">
      <circle cx="280" cy="25" r="6"/><circle cx="335" cy="-16" r="5"/><circle cx="-310" cy="20" r="5"/><circle cx="-365" cy="-15" r="6"/>
    </g>
  </g>

  <rect x="170" y="490" width="860" height="18" rx="9" fill="url(#temp)"/>
  <text x="170" y="540" fill="#ffb25b" font-size="18" font-family="sans-serif">高溫｜金屬、岩石為主</text>
  <text x="820" y="540" fill="#6ed4ff" font-size="18" font-family="sans-serif">低溫｜更多揮發物可凝結</text>
  <text x="70" y="625" fill="#9aa6b2" font-size="16" font-family="sans-serif">雪線是溫度條件的概念界線，不是盤面中的實體牆。</text>
</svg>